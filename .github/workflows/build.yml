name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Cordova project
        run: cordova create /tmp/FitnessApp com.hemo4321.fitnesstracker FitnessTracker

      - name: Add Android platform
        run: cd /tmp/FitnessApp && cordova platform add android

      - name: Inline JS libraries into HTML
        # Bundles React + ReactDOM + Recharts with esbuild into a single IIFE that
        # explicitly sets window.React / window.ReactDOM / window.Recharts.
        # This bypasses all UMD detection logic which misfires in Cordova's WebView.
        run: |
          npm install react@18.2.0 react-dom@18.2.0 recharts@2.10.0 --prefix /tmp/libs
          npm install -g esbuild

          # Entry: explicitly assign all three globals
          cat > /tmp/bundle-entry.js << 'EOF'
          var React = require('react');
          var ReactDOM = require('react-dom');
          var Recharts = require('recharts');
          window.React = React;
          window.ReactDOM = ReactDOM;
          window.Recharts = Recharts;
          EOF

          NODE_PATH=/tmp/libs/node_modules esbuild /tmp/bundle-entry.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --minify \
            --define:process.env.NODE_ENV='"production"' \
            --outfile=/tmp/react-recharts-bundle.js
          echo "Bundle size: $(wc -c < /tmp/react-recharts-bundle.js) bytes"

          cat > /tmp/inline.py << 'PYEOF'
          import re, sys, os

          html   = open('fitness-tracker.html', 'r', encoding='utf-8').read()
          bundle = open('/tmp/react-recharts-bundle.js', 'r', encoding='utf-8').read()
          print('bundle:', len(bundle)//1024, 'KB')

          def safe(js): return re.sub(r'</', r'<\\/', js)

          # Remove the separate React and ReactDOM CDN tags (covered by bundle)
          html = html.replace('<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>', '')
          html = html.replace('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>', '')
          # Replace Recharts CDN tag with the all-in-one bundle
          html = html.replace('<script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.js"></script>',
                              '<script>' + safe(bundle) + '</script>')

          for cdn in ['unpkg.com/react@18', 'unpkg.com/react-dom@18', 'unpkg.com/recharts']:
            if cdn in html:
              sys.exit('ERROR: CDN URL still present after inlining: ' + cdn)

          out = '/tmp/FitnessApp/www/index.html'
          open(out, 'w', encoding='utf-8').write(html)
          print('Inlined OK, size:', len(html)//1024, 'KB, written to', out)
          PYEOF
          python3 /tmp/inline.py

      - name: Build APK
        run: cd /tmp/FitnessApp && cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-tracker-apk
          path: /tmp/FitnessApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
