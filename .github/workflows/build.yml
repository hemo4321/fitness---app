name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create Expo project
        run: npx create-expo-app@latest FitnessTracker --template blank-typescript

      - name: Install dependencies
        run: cd FitnessTracker && npx expo install react-native-webview

      - name: Download JS libraries via npm
        run: |
          npm install react@18.2.0 react-dom@18.2.0 recharts@2.10.0 --prefix /tmp/libs
          cp /tmp/libs/node_modules/react/umd/react.production.min.js /tmp/react.js
          cp /tmp/libs/node_modules/react-dom/umd/react-dom.production.min.js /tmp/react-dom.js
          cp /tmp/libs/node_modules/recharts/umd/Recharts.js /tmp/recharts.js
          echo "react: $(wc -c < /tmp/react.js) bytes"
          echo "react-dom: $(wc -c < /tmp/react-dom.js) bytes"
          echo "recharts: $(wc -c < /tmp/recharts.js) bytes"

      - name: Inline libraries into HTML
        run: |
          python3 -c "
          html     = open('fitness-tracker.html', 'r', encoding='utf-8').read()
          react    = open('/tmp/react.js',         'r', encoding='utf-8').read()
          reactdom = open('/tmp/react-dom.js',     'r', encoding='utf-8').read()
          recharts = open('/tmp/recharts.js',      'r', encoding='utf-8').read()
          html = html.replace('<script src=\"https://unpkg.com/react@18/umd/react.production.min.js\"></script>', '<script>' + react + '</script>')
          html = html.replace('<script src=\"https://unpkg.com/react-dom@18/umd/react-dom.production.min.js\"></script>', '<script>' + reactdom + '</script>')
          html = html.replace('<script src=\"https://unpkg.com/recharts@2.10.0/umd/Recharts.js\"></script>', '<script>' + recharts + '</script>')
          open('fitness-tracker-inline.html', 'w', encoding='utf-8').write(html)
          print('Inline done, size:', len(html)//1024, 'KB')
          "

      - name: Setup App.tsx
        run: |
          python3 -c "
          import json
          html = open('fitness-tracker-inline.html','r',encoding='utf-8').read()
          esc = json.dumps(html)
          lines = [
            'import { SafeAreaView, StatusBar } from \"react-native\";',
            'import { WebView } from \"react-native-webview\";',
            'const HTML: string = ' + esc + ';',
            'export default function App() {',
            '  return (',
            '    <SafeAreaView style={{flex:1,backgroundColor:\"#080C0E\"}}>',
            '      <StatusBar barStyle=\"light-content\" />',
            '      <WebView',
            '        source={{html: HTML, baseUrl: \"http://localhost/\"}}',
            '        style={{flex:1}}',
            '        javaScriptEnabled={true}',
            '        domStorageEnabled={true}',
            '        allowUniversalAccessFromFileURLs={true}',
            '        mixedContentMode=\"always\"',
            '        originWhitelist={[\"*\"]}',
            '      />',
            '    </SafeAreaView>',
            '  );',
            '}',
          ]
          open('FitnessTracker/App.tsx','w',encoding='utf-8').write('\n'.join(lines))
          print('App.tsx written, size:', len('\n'.join(lines))//1024, 'KB')
          "

      - name: Setup config files
        run: |
          echo '{"cli":{"version":">= 16.0.0"},"build":{"preview":{"android":{"buildType":"apk"}}}}' > FitnessTracker/eas.json
          python3 -c "
          import json
          with open('FitnessTracker/app.json','r') as f:
            config = json.load(f)
          config['expo']['android'] = {'package': 'com.hemo4321.fitnesstracker'}
          with open('FitnessTracker/app.json','w') as f:
            json.dump(config, f, indent=2)
          print('app.json updated')
          "

      - name: Init EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && eas init --id 7b50975b-dc4c-4c54-95e5-bfdff1915a08 --force --non-interactive

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile preview --non-interactive
