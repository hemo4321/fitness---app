name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Create Expo project
        # Build in /tmp — outside the git repo — so EAS CLI has no parent
        # .gitignore to inherit (repo .gitignore lists FitnessTracker/).
        run: npx create-expo-app@latest /tmp/FitnessTracker --template blank-typescript --yes

      - name: Install dependencies
        run: cd /tmp/FitnessTracker && npx expo install react-native-webview

      - name: Inline JS libraries into HTML
        run: |
          npm install react@18.2.0 react-dom@18.2.0 recharts@2.10.0 --prefix /tmp/libs
          python3 -c "
          html     = open('fitness-tracker.html', 'r', encoding='utf-8').read()
          react    = open('/tmp/libs/node_modules/react/umd/react.production.min.js', 'r', encoding='utf-8').read()
          reactdom = open('/tmp/libs/node_modules/react-dom/umd/react-dom.production.min.js', 'r', encoding='utf-8').read()
          recharts = open('/tmp/libs/node_modules/recharts/umd/Recharts.js', 'r', encoding='utf-8').read()
          html = html.replace('<script src=\"https://unpkg.com/react@18/umd/react.production.min.js\"></script>', '<script>' + react + '</script>')
          html = html.replace('<script src=\"https://unpkg.com/react-dom@18/umd/react-dom.production.min.js\"></script>', '<script>' + reactdom + '</script>')
          html = html.replace('<script src=\"https://unpkg.com/recharts@2.10.0/umd/Recharts.js\"></script>', '<script>' + recharts + '</script>')
          open('/tmp/fitness-tracker-inline.html', 'w', encoding='utf-8').write(html)
          print('Inline done, size:', len(html)//1024, 'KB')
          "

      - name: Setup App.tsx
        run: |
          python3 -c "
          import json, os

          # Write the large inlined HTML as a plain JS module so TypeScript never
          # compiles the huge string — Metro bundles plain JS without tsc overhead.
          html = open('/tmp/fitness-tracker-inline.html', 'r', encoding='utf-8').read()
          esc  = json.dumps(html)
          js_path = '/tmp/FitnessTracker/htmlContent.js'
          open(js_path, 'w', encoding='utf-8').write('module.exports = ' + esc + ';\n')
          print('htmlContent.js:', os.path.getsize(js_path)//1024, 'KB')

          # App.tsx stays small — just the WebView shell.
          lines = [
            'import { SafeAreaView, StatusBar } from \"react-native\";',
            'import { WebView } from \"react-native-webview\";',
            '// eslint-disable-next-line @typescript-eslint/no-var-requires',
            'const HTML: string = require(\"./htmlContent\");',
            'export default function App() {',
            '  return (',
            '    <SafeAreaView style={{flex:1,backgroundColor:\"#080C0E\"}}>',
            '      <StatusBar barStyle=\"light-content\" />',
            '      <WebView',
            '        source={{html: HTML, baseUrl: \"http://localhost/\"}}',
            '        style={{flex:1}}',
            '        javaScriptEnabled={true}',
            '        domStorageEnabled={true}',
            '        allowUniversalAccessFromFileURLs={true}',
            '        mixedContentMode=\"always\"',
            '        originWhitelist={[\"*\"]}',
            '      />',
            '    </SafeAreaView>',
            '  );',
            '}',
          ]
          open('/tmp/FitnessTracker/App.tsx','w',encoding='utf-8').write('\n'.join(lines))
          print('App.tsx written:', len('\n'.join(lines))//1024, 'KB')
          "

      - name: Setup config files
        run: |
          echo '{"cli":{"version":">= 16.0.0"},"build":{"preview":{"android":{"buildType":"apk"}}}}' > /tmp/FitnessTracker/eas.json
          python3 -c "
          import json
          with open('/tmp/FitnessTracker/app.json','r') as f:
            config = json.load(f)
          config['expo']['android'] = {'package': 'com.hemo4321.fitnesstracker'}
          with open('/tmp/FitnessTracker/app.json','w') as f:
            json.dump(config, f, indent=2)
          print('app.json updated')
          "

      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Go to repo Settings → Secrets → Actions and add EXPO_TOKEN."
            echo "Get your token from https://expo.dev → Account → Access Tokens"
            exit 1
          fi
          echo "EXPO_TOKEN is set ✓"

      - name: Init EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd /tmp/FitnessTracker && eas init --id 7b50975b-dc4c-4c54-95e5-bfdff1915a08 --force --non-interactive

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd /tmp/FitnessTracker && EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile preview --non-interactive
