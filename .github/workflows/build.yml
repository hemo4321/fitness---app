name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: cd FitnessTracker && npm install

      - name: Build APK
        run: cd FitnessTracker && EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile preview --non-interactive

      - name: Download APK
        run: |
          APK_URL=$(cd FitnessTracker && eas build:list --platform android --limit 1 --json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(d)[0].artifacts.buildUrl)")
          curl -L "$APK_URL" -o fitness-tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-tracker-apk
          path: fitness-tracker.apk
