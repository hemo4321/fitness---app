name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create Expo project
        run: npx create-expo-app@latest FitnessTracker --template blank-typescript

      - name: Install dependencies
        run: cd FitnessTracker && npx expo install react-native-webview

      - name: Setup files
        run: |
          python3 << 'PYEOF'
          import json

          with open('fitness-tracker.html', 'r', encoding='utf-8') as f:
              html_content = f.read()

          html_escaped = json.dumps(html_content)

          app_code = """import { SafeAreaView, StatusBar } from 'react-native';
import { WebView } from 'react-native-webview';

const HTML = """ + html_escaped + """;

export default function App() {
  return (
    <SafeAreaView style={{flex:1, backgroundColor:'#080C0E'}}>
      <StatusBar barStyle="light-content" />
      <WebView
        source={{html: HTML, baseUrl: 'file:///android_asset/'}}
        style={{flex:1}}
        javaScriptEnabled={true}
        domStorageEnabled={true}
        originWhitelist={['*']}
      />
    </SafeAreaView>
  );
}
"""
          with open('FitnessTracker/App.tsx', 'w', encoding='utf-8') as f:
              f.write(app_code)
          print('App.tsx written OK')
          PYEOF

          echo '{"cli":{"version":">= 16.0.0"},"build":{"preview":{"android":{"buildType":"apk"}}}}' > FitnessTracker/eas.json
          python3 -c "
          import json
          with open('FitnessTracker/app.json','r') as f:
            config = json.load(f)
          config['expo']['android'] = {'package': 'com.hemo4321.fitnesstracker'}
          with open('FitnessTracker/app.json','w') as f:
            json.dump(config, f, indent=2)
          print('app.json updated')
          "

      - name: Init EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && eas init --id 7b50975b-dc4c-4c54-95e5-bfdff1915a08 --force --non-interactive

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile preview --non-interactive
