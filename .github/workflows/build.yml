name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create Expo project
        run: npx create-expo-app@latest FitnessTracker --template blank-typescript

      - name: Install dependencies
        run: cd FitnessTracker && npx expo install react-native-webview expo-asset

      - name: Setup files
        run: |
          cp fitness-tracker.html FitnessTracker/assets/fitness-babel.html
          python3 -c "
          f = open('FitnessTracker/App.tsx','w')
          f.write(\"import { SafeAreaView, StatusBar } from 'react-native';\n\")
          f.write(\"import { WebView } from 'react-native-webview';\n\")
          f.write(\"import { Asset } from 'expo-asset';\n\")
          f.write(\"import { useState, useEffect } from 'react';\n\")
          f.write(\"export default function App() {\n\")
          f.write(\"  const [uri, setUri] = useState('');\n\")
          f.write(\"  useEffect(() => { (async () => { const a = Asset.fromModule(require('./assets/fitness-babel.html')); await a.downloadAsync(); setUri(a.localUri!); })(); }, []);\n\")
          f.write(\"  if (!uri) return null;\n\")
          f.write(\"  return (<SafeAreaView style={{flex:1,backgroundColor:'#080C0E'}}><StatusBar barStyle='light-content' /><WebView source={{uri}} style={{flex:1}} javaScriptEnabled domStorageEnabled originWhitelist={['*']} allowFileAccess={true} /></SafeAreaView>);\n\")
          f.write('}\n')
          f.close()
          "
          echo '{"cli":{"version":">= 16.0.0"},"build":{"preview":{"android":{"buildType":"apk"}}}}' > FitnessTracker/eas.json
          python3 -c "
          import json
          with open('FitnessTracker/app.json','r') as f:
            config = json.load(f)
          config['expo']['android'] = {'package': 'com.hemo4321.fitnesstracker'}
          with open('FitnessTracker/app.json','w') as f:
            json.dump(config, f, indent=2)
          print('app.json updated')
          "

      - name: Init EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && eas init --id 7b50975b-dc4c-4c54-95e5-bfdff1915a08 --force --non-interactive

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile preview --non-interactive
