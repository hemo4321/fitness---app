name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Expo project
        # Build in /tmp — outside the git repo — so EAS CLI has no parent
        # .gitignore to inherit (repo .gitignore lists FitnessTracker/).
        # Pin to create-expo-app@3 to avoid breaking changes in @latest.
        run: npx create-expo-app@3 /tmp/FitnessTracker --template blank-typescript --yes

      - name: Install dependencies
        run: |
          cd /tmp/FitnessTracker
          npx expo install react-native-webview

      - name: Inline JS libraries into HTML
        run: |
          npm install react@18.2.0 react-dom@18.2.0 recharts@2.10.0 --prefix /tmp/libs
          cat > /tmp/inline.py << 'PYEOF'
          import re
          html     = open('fitness-tracker.html', 'r', encoding='utf-8').read()
          react    = open('/tmp/libs/node_modules/react/umd/react.production.min.js', 'r', encoding='utf-8').read()
          reactdom = open('/tmp/libs/node_modules/react-dom/umd/react-dom.production.min.js', 'r', encoding='utf-8').read()
          recharts = open('/tmp/libs/node_modules/recharts/umd/Recharts.js', 'r', encoding='utf-8').read()
          def safe(js): return re.sub(r'</', r'<\\/', js)
          html = html.replace('<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>', '<script>' + safe(react) + '</script>')
          html = html.replace('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>', '<script>' + safe(reactdom) + '</script>')
          html = html.replace('<script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.js"></script>', '<script>' + safe(recharts) + '</script>')
          open('/tmp/fitness-tracker-inline.html', 'w', encoding='utf-8').write(html)
          print('Inline done, size:', len(html)//1024, 'KB')
          PYEOF
          python3 /tmp/inline.py

      - name: Copy HTML to Expo assets
        run: |
          mkdir -p /tmp/FitnessTracker/assets
          cp /tmp/fitness-tracker-inline.html /tmp/FitnessTracker/assets/app.html
          echo "Copied: $(wc -c < /tmp/FitnessTracker/assets/app.html) bytes"

      - name: Create Android assets config plugin
        # Copies assets/app.html into android/app/src/main/assets/ during prebuild
        # so WebView can load it via file:///android_asset/app.html — no network, no Expo
        # asset system, no cleartext-traffic issues.
        run: |
          cat > /tmp/FitnessTracker/withAndroidAssets.js << 'EOF'
          const { withDangerousMod } = require('@expo/config-plugins');
          const fs = require('fs');
          const path = require('path');
          module.exports = function withAndroidAssets(config) {
            return withDangerousMod(config, [
              'android',
              async (config) => {
                const assetsDir = path.join(
                  config.modRequest.platformProjectRoot,
                  'app/src/main/assets'
                );
                fs.mkdirSync(assetsDir, { recursive: true });
                fs.copyFileSync(
                  path.join(config.modRequest.projectRoot, 'assets/app.html'),
                  path.join(assetsDir, 'app.html')
                );
                console.log('withAndroidAssets: app.html copied to Android assets');
                return config;
              },
            ]);
          };
          EOF

      - name: Setup App.tsx
        run: |
          cat > /tmp/FitnessTracker/App.tsx << 'APPTSX'
          import { SafeAreaView, StatusBar, View, Text } from 'react-native';
          import { WebView } from 'react-native-webview';
          import { useState } from 'react';

          export default function App() {
            const [err, setErr] = useState<string | null>(null);

            if (err) {
              return (
                <SafeAreaView style={{ flex: 1, backgroundColor: '#080C0E',
                  justifyContent: 'center', alignItems: 'center' }}>
                  <Text style={{ color: '#FF4444', padding: 24, textAlign: 'center' }}>
                    {err}
                  </Text>
                </SafeAreaView>
              );
            }

            return (
              <SafeAreaView style={{ flex: 1, backgroundColor: '#080C0E' }}>
                <StatusBar barStyle="light-content" />
                <WebView
                  source={{ uri: 'file:///android_asset/app.html' }}
                  style={{ flex: 1 }}
                  javaScriptEnabled={true}
                  domStorageEnabled={true}
                  allowFileAccess={true}
                  allowFileAccessFromFileURLs={true}
                  allowUniversalAccessFromFileURLs={true}
                  mixedContentMode="always"
                  originWhitelist={['*']}
                  onError={(e) => setErr('Load error: ' + e.nativeEvent.description)}
                  onHttpError={(e) => setErr('HTTP ' + e.nativeEvent.statusCode)}
                />
              </SafeAreaView>
            );
          }
          APPTSX
          echo "App.tsx written"

      - name: Setup app.json
        run: |
          cat > /tmp/patch_appjson.py << 'PYEOF'
          import json
          with open('/tmp/FitnessTracker/app.json', 'r') as f:
            config = json.load(f)
          config['expo']['android'] = {'package': 'com.hemo4321.fitnesstracker'}
          config['expo']['plugins'] = ['./withAndroidAssets']
          with open('/tmp/FitnessTracker/app.json', 'w') as f:
            json.dump(config, f, indent=2)
          print('app.json updated')
          PYEOF
          python3 /tmp/patch_appjson.py

      - name: Prebuild Android project
        run: cd /tmp/FitnessTracker && npx expo prebuild --platform android --clean --non-interactive

      - name: Build APK with Gradle
        run: |
          cd /tmp/FitnessTracker/android
          chmod +x gradlew
          # assembleRelease always bundles JS (no flag needed) and Expo's
          # prebuild configures it to sign with the debug keystore by default.
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-tracker-apk
          path: /tmp/FitnessTracker/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
