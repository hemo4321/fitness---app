name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create Expo project
        run: npx create-expo-app@latest FitnessTracker --template blank-typescript

      - name: Install dependencies
        run: cd FitnessTracker && npm install react-native-webview expo-asset expo-file-system

      - name: Setup files
        run: |
          cp fitness-tracker.html FitnessTracker/assets/fitness-babel.html
          mkdir -p FitnessTracker/app
          python3 -c "
          code = open('setup_app.py').read() if __import__('os').path.exists('setup_app.py') else ''
          f = open('FitnessTracker/app/index.tsx','w')
          f.write(\"import { SafeAreaView, StatusBar } from 'react-native';\n\")
          f.write(\"import { WebView } from 'react-native-webview';\n\")
          f.write(\"import { Asset } from 'expo-asset';\n\")
          f.write(\"import { useState, useEffect } from 'react';\n\")
          f.write(\"import * as FileSystem from 'expo-file-system';\n\")
          f.write(\"export default function App() {\n\")
          f.write(\"  const [html, setHtml] = useState('');\n\")
          f.write(\"  useEffect(() => { (async () => { const a = Asset.fromModule(require('../assets/fitness-babel.html')); await a.downloadAsync(); setHtml(await FileSystem.readAsStringAsync(a.localUri)); })(); }, []);\n\")
          f.write(\"  return (<SafeAreaView style={{flex:1,backgroundColor:'#080C0E'}}><StatusBar barStyle='light-content' /><WebView source={{html,baseUrl:''}} style={{flex:1}} javaScriptEnabled domStorageEnabled originWhitelist={['*']} /></SafeAreaView>);\n\")
          f.write('}\n')
          f.close()
          "
          echo '{"cli":{"version":">= 16.0.0"},"build":{"preview":{"android":{"buildType":"apk"}}}}' > FitnessTracker/eas.json

      - name: Init EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && eas init --id $(eas project:info --json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "") --non-interactive || eas init --non-interactive

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: cd FitnessTracker && EAS_SKIP_AUTO_FINGERPRINT=1 eas build --platform android --profile preview --non-interactive
