name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Cordova project
        run: cordova create /tmp/FitnessApp com.hemo4321.fitnesstracker FitnessTracker

      - name: Add Android platform
        run: cd /tmp/FitnessApp && cordova platform add android

      - name: Inline JS libraries into HTML
        # Replaces CDN <script> tags with self-contained inline versions so the
        # WebView works fully offline. Fails hard if any CDN URL survives.
        run: |
          npm install react@18.2.0 react-dom@18.2.0 recharts@2.10.0 --prefix /tmp/libs
          cat > /tmp/inline.py << 'PYEOF'
          import re, sys, os

          html     = open('fitness-tracker.html', 'r', encoding='utf-8').read()
          react    = open('/tmp/libs/node_modules/react/umd/react.production.min.js', 'r', encoding='utf-8').read()
          reactdom = open('/tmp/libs/node_modules/react-dom/umd/react-dom.production.min.js', 'r', encoding='utf-8').read()

          recharts = None
          for p in [
            '/tmp/libs/node_modules/recharts/umd/Recharts.js',
            '/tmp/libs/node_modules/recharts/umd/recharts.js',
            '/tmp/libs/node_modules/recharts/umd/Recharts.min.js',
          ]:
            if os.path.exists(p):
              recharts = open(p, 'r', encoding='utf-8').read()
              print('recharts:', p, len(recharts)//1024, 'KB')
              break
          if recharts is None:
            sys.exit('ERROR: recharts UMD file not found')

          def safe(js): return re.sub(r'</', r'<\\/', js)

          html = html.replace('<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>',    '<script>' + safe(react)    + '</script>')
          html = html.replace('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>', '<script>' + safe(reactdom) + '</script>')
          html = html.replace('<script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.js"></script>',        '<script>' + safe(recharts) + '</script>')

          for cdn in ['unpkg.com/react@18', 'unpkg.com/react-dom@18', 'unpkg.com/recharts']:
            if cdn in html:
              sys.exit('ERROR: CDN URL still present after inlining: ' + cdn)

          out = '/tmp/FitnessApp/www/index.html'
          open(out, 'w', encoding='utf-8').write(html)
          print('Inlined OK, size:', len(html)//1024, 'KB, written to', out)
          PYEOF
          python3 /tmp/inline.py

      - name: Build APK
        run: cd /tmp/FitnessApp && cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-tracker-apk
          path: /tmp/FitnessApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
