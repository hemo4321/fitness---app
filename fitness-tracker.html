// Mock window.storage with localStorage
window.storage = {
  get: async (key) => {
    try {
      const val = localStorage.getItem(key);
      return val ? { key, value: val } : null;
    } catch(e) { return null; }
  },
  set: async (key, value) => {
    try { localStorage.setItem(key, value); return { key, value }; } catch(e) { return null; }
  },
  delete: async (key) => {
    try { localStorage.removeItem(key); return { key, deleted: true }; } catch(e) { return null; }
  }
};

const getLastSession = (logs, name, type) => {
  const dates = Object.keys(logs).sort().reverse();
  for (const date of dates) {
    const match = (logs[date]?.workouts||[]).find(w =>
      type === 'resistance' ? w.exercise === name : w.activity === name
    );
    if (match) return { date, ...match };
  }
  return null;
};

const daysSince = (dateStr) => {
  if (!dateStr) return null;
  return Math.floor((new Date() - new Date(dateStr + 'T00:00:00')) / 86400000);
};

const genId = () => Math.random().toString(36).substr(2, 9);
const todayStr = () => new Date().toISOString().split('T')[0];
const fmtDate = (d) => { try { return new Date(d + 'T00:00:00').toLocaleDateString('ar-SA', {month:'short', day:'numeric'}); } catch(e) { return d; } };
const fmtDay  = (d) => { try { return new Date(d + 'T00:00:00').toLocaleDateString('ar-SA', {weekday:'short'}); } catch(e) { return d; } };
const nowTime = () => new Date().toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'});
const fmt = (n, d=1) => { const r = parseFloat((+n).toFixed(d)); return isNaN(r) ? 0 : r; };

// ── RING ──────────────────────────────────────────────────────────────────────
function Ring({ value, max, size=140, stroke=13, color='#00E5A0', children }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const pct = Math.min(Math.max(value / max, 0), 1);
  return (
    <div style={{position:'relative', width:size, height:size, flexShrink:0}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1C2730" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
          style={{transition:'stroke-dashoffset 0.6s ease'}}/>
      </svg>
      <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
        {children}
      </div>
    </div>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({todayData, logs, weightLog, saveWeightLog, onExport, onImportParse, onImportConfirm, importMsg, showImport, setShowImport, importJson, setImportJson, exportText, setExportText, importStep, setImportStep, importPreview}) {
  const {meals=[], workouts=[]} = todayData;
  const caloriesIn  = fmt(meals.reduce((s,m) => s+(m.calories||0), 0), 1);
  const protein     = fmt(meals.reduce((s,m) => s+(m.protein||0), 0), 1);
  const burned      = workouts.reduce((s,w) => s+(w.caloriesBurned||0), 0);
  const remaining   = fmt(PROFILE.dailyCalories - caloriesIn + burned, 1);
  const net         = fmt(caloriesIn - burned, 1);
  const over        = caloriesIn > PROFILE.dailyCalories;

  const [newWeight, setNewWeight] = useState('');
  const todayW       = weightLog.find(w => w.date === todayStr());
  const lastW        = weightLog[weightLog.length-1];
  const currentWeight = todayW?.weight || lastW?.weight || PROFILE.startWeight;
  const lostSoFar    = +(PROFILE.startWeight - currentWeight).toFixed(1);
  const remainKg     = Math.max(currentWeight - PROFILE.goalWeight, 0).toFixed(1);
  const progressPct  = Math.min((lostSoFar / (PROFILE.startWeight - PROFILE.goalWeight)) * 100, 100).toFixed(1);

  const logWeight = () => {
    const val = parseFloat(newWeight);
    if (!val || val < 30 || val > 300) return;
    const filtered = weightLog.filter(w => w.date !== todayStr());
    saveWeightLog([...filtered, {date:todayStr(), weight:val}].sort((a,b)=>a.date.localeCompare(b.date)));
    setNewWeight('');
  };

  const Badge = ({label, value, unit, color='#E8F0F2', note}) => (
    <div style={{flex:1,background:'#0E151A',borderRadius:14,padding:'12px 10px'}}>
      <div style={{fontSize:9,color:'#3D5560',marginBottom:4,textTransform:'uppercase',letterSpacing:'0.5px'}}>{label}</div>
      <div style={{fontSize:20,fontWeight:700,color,lineHeight:1}}>{value}<span style={{fontSize:10,fontWeight:400,marginRight:2}}>{unit}</span></div>
      {note && <div style={{fontSize:9,color:'#3D5560',marginTop:3}}>{note}</div>}
    </div>
  );

  return (
    <div style={{padding:'20px 16px 12px',direction:'rtl'}}>
      <div style={{marginBottom:18}}>
        <div style={{fontSize:11,color:'#3D5560'}}>{new Date().toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
        <div style={{fontSize:27,fontWeight:800,fontFamily:'Syne,sans-serif',marginTop:2,letterSpacing:'-0.5px'}}>لوحة اليوم ⚡</div>
      </div>

      {/* Calories card */}
      <div style={{background:'#0E151A',borderRadius:22,padding:18,marginBottom:12,display:'flex',alignItems:'center',gap:18,border:'1px solid #1C2730'}}>
        <Ring value={caloriesIn} max={PROFILE.dailyCalories} size={130} stroke={13} color={over?'#FF4444':'#00E5A0'}>
          <div style={{fontSize:22,fontWeight:800,fontFamily:'Syne,sans-serif',color:over?'#FF4444':'#00E5A0',lineHeight:1}}>{caloriesIn}</div>
          <div style={{fontSize:9,color:'#3D5560',marginTop:2}}>من {PROFILE.dailyCalories}</div>
          <div style={{fontSize:9,color:'#3D5560'}}>سعرة</div>
        </Ring>
        <div style={{flex:1,display:'flex',flexDirection:'column',gap:12}}>
          <div>
            <div style={{fontSize:9,color:'#3D5560'}}>متبقي اليوم</div>
            <div style={{fontSize:26,fontWeight:800,fontFamily:'Syne,sans-serif',color:remaining>=0?'#00E5A0':'#FF4444',lineHeight:1.1}}>{remaining}<span style={{fontSize:11,fontWeight:400}}> كال</span></div>
          </div>
          <div style={{height:1,background:'#1C2730'}}/>
          <div style={{display:'flex',gap:16}}>
            <div>
              <div style={{fontSize:9,color:'#3D5560'}}>محروق</div>
              <div style={{fontSize:17,fontWeight:600,color:'#FF8C42'}}>{burned}<span style={{fontSize:9}}> كال</span></div>
            </div>
            <div>
              <div style={{fontSize:9,color:'#3D5560'}}>بروتين</div>
              <div style={{fontSize:17,fontWeight:600,color:'#5B9CF6'}}>{protein}g<span style={{fontSize:9,color:'#3D5560'}}> / {PROFILE.dailyProtein}</span></div>
            </div>
          </div>
        </div>
      </div>

      {/* Protein bar */}
      <div style={{background:'#0E151A',borderRadius:16,padding:14,marginBottom:12,border:'1px solid #1C2730'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:12,fontWeight:600}}>🥩 البروتين</span>
          <span style={{fontSize:12,color:protein>=PROFILE.dailyProtein?'#00E5A0':'#E8F0F2',fontWeight:600}}>{protein}g <span style={{color:'#3D5560',fontWeight:400}}>/ {PROFILE.dailyProtein}g</span></span>
        </div>
        <div style={{height:8,background:'#1C2730',borderRadius:4,overflow:'hidden',marginBottom:5}}>
          <div style={{height:'100%',width:`${Math.min(protein/PROFILE.dailyProtein*100,100)}%`,background:'linear-gradient(90deg,#3B6FD8,#5B9CF6)',borderRadius:4,transition:'width 0.5s'}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#3D5560'}}>
          <span>متبقي: {fmt(Math.max(PROFILE.dailyProtein-protein,0),1)}g</span>
          <span>{Math.min(Math.round(protein/PROFILE.dailyProtein*100),100)}%</span>
        </div>
      </div>

      {/* Weight log */}
      <div style={{background:'#0E151A',borderRadius:20,padding:16,marginBottom:12,border:'1px solid #1C2730'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700}}>⚖️ سجل الوزن</div>
          {lastW && <div style={{fontSize:10,color: todayW ? '#00E5A0' : '#3D5560'}}>
            {todayW ? '✓ سجّلت اليوم' : `آخر تسجيل: ${fmtDate(lastW.date)}`}
          </div>}
        </div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input type="number" placeholder="وزنك الحالي (kg)" value={newWeight} onChange={e=>setNewWeight(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&logWeight()}
            style={{flex:1,background:'#141D24',border:'1px solid #1C2730',borderRadius:10,padding:'10px 12px',color:'#E8F0F2',fontSize:14,outline:'none'}}/>
          <button onClick={logWeight} style={{background:'#00E5A0',color:'#080C0E',border:'none',borderRadius:10,padding:'10px 18px',fontWeight:700,fontSize:13,cursor:'pointer'}}>سجل</button>
        </div>
        <div style={{display:'flex',gap:8}}>
          {[{l:'الوزن الحالي',v:`${currentWeight}`,u:'kg',c:'#00E5A0'},
            {l:'خسرت',v:lostSoFar>0?`${lostSoFar}`:'0',u:'kg',c:lostSoFar>0?'#00E5A0':'#3D5560'},
            {l:'باقي للهدف',v:remainKg,u:'kg',c:'#FF8C42'},
          ].map(s=>(
            <div key={s.l} style={{flex:1,background:'#141D24',borderRadius:12,padding:'10px 10px'}}>
              <div style={{fontSize:9,color:'#3D5560',marginBottom:4}}>{s.l}</div>
              <div style={{fontSize:17,fontWeight:700,color:s.c,lineHeight:1}}>{s.v}<span style={{fontSize:10,fontWeight:400}}>{s.u}</span></div>
            </div>
          ))}
        </div>
      </div>

      {/* Goal progress */}
      <div style={{background:'#0E151A',borderRadius:16,padding:14,marginBottom:12,border:'1px solid #1C2730'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <span style={{fontSize:13,fontWeight:700}}>🎯 التقدم نحو الهدف</span>
          <span style={{fontSize:13,color:'#00E5A0',fontWeight:700}}>{progressPct}%</span>
        </div>
        <div style={{height:10,background:'#1C2730',borderRadius:5,overflow:'hidden',marginBottom:6}}>
          <div style={{height:'100%',width:`${progressPct}%`,background:'linear-gradient(90deg,#00C870,#00E5A0)',borderRadius:5,transition:'width 0.6s'}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#3D5560'}}>
          <span>البداية: {PROFILE.startWeight}kg</span>
          <span>الهدف: {PROFILE.goalWeight}kg | 6 أشهر</span>
        </div>
      </div>

      {/* Today tiles */}
      <div style={{display:'flex',gap:10,marginBottom:12}}>
        <Badge label="وجبات اليوم" value={meals.length} unit="وجبة" color="#E8F0F2"/>
        <Badge label="تمارين اليوم" value={workouts.length} unit="تمرين" color="#E8F0F2"/>
        <Badge label="صافي السعرات" value={net} unit="كال" color={net<PROFILE.dailyCalories?'#00E5A0':'#FF4444'}/>
      </div>

      {/* Data export/import */}
      <div style={{background:'#0E151A',borderRadius:16,padding:14,border:'1px solid #1C2730'}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:10,color:'#3D5560'}}>💾 نسخ احتياطي</div>
        <button onClick={onExport}
          style={{width:'100%',background:'#141D24',border:'1px solid #1C2730',borderRadius:10,padding:'11px',color:'#E8F0F2',fontSize:13,fontWeight:600,cursor:'pointer',marginBottom:8,textAlign:'center'}}>
          ⬆️ تصدير البيانات
        </button>
        {exportText && (
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:'#3D5560',marginBottom:5}}>اضغط مطولاً على النص ثم "تحديد الكل" للنسخ:</div>
            <textarea readOnly value={exportText} rows={3}
              style={{width:'100%',background:'#0A1015',border:'1px solid #00E5A040',borderRadius:10,padding:'10px 12px',color:'#00E5A0',fontSize:11,outline:'none',resize:'none',direction:'ltr',wordBreak:'break-all'}}/>
            <button onClick={()=>setExportText('')}
              style={{width:'100%',background:'none',border:'none',color:'#3D5560',fontSize:11,padding:'4px',cursor:'pointer'}}>
              ✕ إغلاق

          </div>

        <button onClick={()=>{setShowImport(!showImport); setImportStep('paste'); setImportPreview(null);}}
          style={{width:'100%',background:showImport?'#252E38':'#141D24',border:'1px solid #1C2730',borderRadius:10,padding:'11px',color:'#E8F0F2',fontSize:13,fontWeight:600,cursor:'pointer',textAlign:'center',marginBottom:showImport?8:0}}>
          ⬇️ استيراد — لصق البيانات
        </button>
        {showImport && importStep === 'paste' && (
          <div>
            <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>الصق هنا النص المنسوخ من التصدير:</div>
            <textarea rows={5} value={importJson} onChange={e=>setImportJson(e.target.value)}
              placeholder='{"version":1,...}'
              style={{width:'100%',background:'#141D24',border:'1px solid #1C2730',borderRadius:10,padding:'10px 12px',color:'#E8F0F2',fontSize:11,outline:'none',resize:'vertical',marginBottom:8,direction:'ltr',wordBreak:'break-all'}}/>
            <button onClick={onImportParse} disabled={!importJson.trim()}
              style={{width:'100%',background:importJson.trim()?'#5B9CF6':'#1C2730',color:importJson.trim()?'#fff':'#3D5560',border:'none',borderRadius:10,padding:'10px',fontWeight:700,fontSize:13,cursor:'pointer'}}>
              فحص البيانات →
            </button>
          </div>
        )}
        {showImport && importStep === 'confirm' && importPreview && (
          <div style={{background:'#141D24',borderRadius:12,padding:14,border:'1px solid #FF8C4260'}}>
            <div style={{fontSize:12,fontWeight:700,color:'#FF8C42',marginBottom:10}}>⚠️ تحذير — ستُستبدل بياناتك الحالية</div>
            <div style={{fontSize:11,color:'#C0CDD4',marginBottom:12,lineHeight:1.7}}>
              البيانات التي ستُستورد:<br/>
              🍽️ {importPreview.mealCount} وجبة · 🏋️ {importPreview.workoutCount} تمرين · ⚖️ {importPreview.weightCount} قياس وزن · 💪 {importPreview.muscleCount} تمرين في المجموعات
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={onImportConfirm}
                style={{flex:1,background:'#FF8C42',color:'#080C0E',border:'none',borderRadius:10,padding:'10px',fontWeight:700,fontSize:13,cursor:'pointer'}}>
                نعم، استورد واستبدل
              </button>
              <button onClick={()=>{setImportStep('paste'); setImportPreview(null);}}
                style={{background:'#141D24',color:'#E8F0F2',border:'1px solid #1C2730',borderRadius:10,padding:'10px 14px',fontSize:13,cursor:'pointer'}}>
                إلغاء
              </button>
            </div>
          </div>
        )}
        {importMsg && <div style={{fontSize:11,marginTop:8,color:importMsg.ok?'#00E5A0':'#FF4444',textAlign:'center'}}>{importMsg.text}</div>}
      </div>
    </div>
  );
}

// ── DATE BAR ──────────────────────────────────────────────────────────────────
function DateBar({ selectedDate, setSelectedDate }) {
  const today = todayStr();
  const isToday = selectedDate === today;

  const shift = (days) => {
    const d = new Date(selectedDate + 'T00:00:00');
    d.setDate(d.getDate() + days);
    const next = d.toISOString().split('T')[0];
    if (next <= today) setSelectedDate(next);
  };

  const label = isToday ? 'اليوم' :
    selectedDate === new Date(new Date().setDate(new Date().getDate()-1)).toISOString().split('T')[0]
      ? 'أمس' : fmtDate(selectedDate);

  return (
    <div style={{display:'flex',alignItems:'center',gap:8,background:'#0E151A',borderRadius:12,padding:'8px 12px',marginBottom:16,border:`1px solid ${isToday?'#00E5A040':'#FF8C4240'}`}}>
      <button onClick={()=>shift(-1)}
        style={{background:'#141D24',border:'none',borderRadius:8,width:30,height:30,color:'#E8F0F2',fontSize:18,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>‹</button>
      <div style={{flex:1,textAlign:'center'}}>
        <div style={{fontSize:13,fontWeight:700,color:isToday?'#00E5A0':'#FF8C42'}}>{label}</div>
        <div style={{fontSize:10,color:'#3D5560'}}>{selectedDate}</div>
      </div>
      <button onClick={()=>shift(1)} disabled={isToday}
        style={{background:'#141D24',border:'none',borderRadius:8,width:30,height:30,color:isToday?'#252E38':'#E8F0F2',fontSize:18,cursor:isToday?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>›</button>
      {!isToday && (
        <button onClick={()=>setSelectedDate(today)}
          style={{background:'#00E5A020',border:'1px solid #00E5A040',borderRadius:8,padding:'4px 10px',color:'#00E5A0',fontSize:11,fontWeight:600,cursor:'pointer'}}>
          اليوم
        </button>
      )}
      <input type="date" value={selectedDate} max={today}
        onChange={e=>e.target.value&&setSelectedDate(e.target.value)}
        style={{background:'#141D24',border:'1px solid #1C2730',borderRadius:8,padding:'4px 8px',color:'#E8F0F2',fontSize:11,cursor:'pointer',width:36,opacity:0.01,position:'absolute'}}/>
      <button onClick={()=>document.querySelector('input[type=date]')?.showPicker?.()}
        style={{background:'#141D24',border:'1px solid #1C2730',borderRadius:8,width:30,height:30,color:'#3D5560',fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>📅</button>
    </div>
  );
}

// ── WORKOUT ───────────────────────────────────────────────────────────────────
function Workout({todayData, addWorkout, deleteWorkout, editWorkout, logs, muscleGroups, selectedDate, setSelectedDate}) {
  const {workouts=[]} = todayData;
  const [mode,       setMode]       = useState('resistance');
  const [exercise,   setExercise]   = useState(EXERCISES_AR[0]);
  const [customEx,   setCustomEx]   = useState('');
  const [sets,       setSets]       = useState([{weight:'',reps:''}]);
  const [notes,      setNotes]      = useState('');
  const [cardioType, setCardioType] = useState(CARDIO_TYPES[0]);
  const [duration,   setDuration]   = useState('');
  const [distance,   setDistance]   = useState('');
  const [cardioNotes,setCardioNotes]= useState('');
  const [avgSpeed,   setAvgSpeed]    = useState('');
  const [manualCalories, setManualCalories] = useState('');
  const [editingWId,   setEditingWId]   = useState(null);
  const [editWVals,   setEditWVals]    = useState({});
  const [muscleFilter, setMuscleFilter] = useState(null); // selected muscle group id for picker

  const inp = {background:'#141D24',border:'1px solid #1C2730',borderRadius:10,padding:'10px 12px',color:'#E8F0F2',fontSize:14,outline:'none'};
  const calcCardio = () => {
    if (!duration) return 0;
    const d = parseFloat(duration);
    const dist = parseFloat(distance) || 0;
    const w = PROFILE.weight;
    // If distance available: weight-based distance formula (more accurate)
    if (dist > 0 && cardioType.k) {
      return Math.round(w * dist * cardioType.k);
    }
    // Otherwise: NET MET formula (subtract resting rate of 1 MET)
    return Math.round((cardioType.met - 1) * w * (d / 60));
  };
  const totalBurned = workouts.reduce((s,w)=>s+(w.caloriesBurned||0),0);

  // Last session lookup
  const exName = exercise === 'أخرى' ? customEx : exercise;
  const lastResistance = exName && mode==='resistance' ? getLastSession(logs, exName, 'resistance') : null;
  const lastCardio = mode==='cardio' ? getLastSession(logs, cardioType.ar, 'cardio') : null;

  // Muscle group for selected exercise
  const getExsFlat = (g) => g.subGroups ? g.subGroups.flatMap(sg=>sg.exercises||[]) : (g.exercises||[]);
  const exGroup = muscleGroups?.find(g => getExsFlat(g).includes(exName));

  const fmtLastDate = (dateStr) => {
    const d = daysSince(dateStr);
    if (d === 0) return 'اليوم';
    if (d === 1) return 'أمس';
    return `منذ ${d} أيام (${fmtDate(dateStr)})`;
  };

  const submitResistance = () => {
    const exName = exercise==='أخرى' ? customEx : exercise;
    if (!exName) return;
    const validSets = sets.filter(s=>s.weight&&s.reps);
    if (!validSets.length) return;
    const totalReps = validSets.reduce((s,set)=>s+parseInt(set.reps),0);
    addWorkout({type:'resistance', exercise:exName, sets:validSets.map(s=>({weight:parseFloat(s.weight),reps:parseInt(s.reps)})), caloriesBurned:(()=>{
        // Estimate: each set ~45s active + overhead, MET≈6 for resistance
        // Active calories = (MET-1) × weight × active_hours
        // Average weight lifted per rep ≈ bodyweight% + bar weight
        const setsCount = validSets.length;
        const avgReps = totalReps / setsCount;
        const avgBarWeight = validSets.reduce((s,sv)=>s+(parseFloat(sv.weight)||0),0) / setsCount;
        const activeMinutes = setsCount * 0.75; // ~45s per set
        const metNet = 5.0; // net MET for resistance (6 - 1 resting)
        const weightCals = Math.round(metNet * PROFILE.weight * (activeMinutes/60));
        // Add small component for weight moved (heavier = more work)
        const workCals = Math.round(totalReps * avgBarWeight * 0.003);
        return weightCals + workCals;
      })(), notes});
    setSets([{weight:'',reps:''}]); setNotes(''); setCustomEx('');
  };

  const submitCardio = () => {
    if (!duration) return;
    const cal = manualCalories ? parseFloat(manualCalories) : calcCardio();
    const spd = avgSpeed ? parseFloat(avgSpeed) : (distance && duration ? parseFloat((parseFloat(distance)/parseFloat(duration)*60).toFixed(1)) : null);
    addWorkout({type:'cardio', activity:cardioType.ar, icon:cardioType.icon, duration:parseFloat(duration), distance:parseFloat(distance)||null, avgSpeed:spd, caloriesBurned:cal, notes:cardioNotes});
    setDuration(''); setDistance(''); setCardioNotes(''); setAvgSpeed(''); setManualCalories('');
  };

  const speed = distance && duration && parseFloat(duration)>0 ? (parseFloat(distance)/parseFloat(duration)*60).toFixed(1) : null;

  return (
    <div style={{padding:'20px 16px 12px',direction:'rtl'}}>
      <div style={{marginBottom:18,display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div style={{fontSize:27,fontWeight:800,fontFamily:'Syne,sans-serif',letterSpacing:'-0.5px'}}>التمارين 🏋️</div>
          <div style={{fontSize:11,color:'#3D5560',marginTop:4}}>{workouts.length} تمرين · {totalBurned} كال محروق</div>
        </div>
      </div>
      <DateBar selectedDate={selectedDate} setSelectedDate={setSelectedDate}/>

      {/* Toggle */}
      <div style={{display:'flex',background:'#0E151A',borderRadius:14,padding:4,marginBottom:18,gap:4,border:'1px solid #1C2730'}}>
        {['resistance','cardio'].map(m=>(
          <button key={m} onClick={()=>setMode(m)}
            style={{flex:1,padding:'10px',borderRadius:10,border:'none',fontWeight:700,fontSize:13,background:mode===m?'#00E5A0':'none',color:mode===m?'#080C0E':'#3D5560',cursor:'pointer',transition:'all 0.2s'}}>
            {m==='resistance'?'🏋️ مقاومة':'🏃 كارديو'}
          </button>
        ))}
      </div>

      {/* Resistance form */}
      {mode==='resistance' && (
        <div style={{background:'#0E151A',borderRadius:22,padding:16,marginBottom:14,border:'1px solid #1C2730'}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>سجل تمرين القوة</div>
          {/* Step 1 — muscle group selector */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:'#3D5560',marginBottom:8}}>① اختر المجموعة العضلية</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {muscleGroups.filter(g=>getExsFlat(g).length>0).map(g=>(
                <button key={g.id} onClick={()=>{setMuscleFilter(g.id);setExercise(getExsFlat(g)[0]||'');}}
                  style={{padding:'6px 12px',borderRadius:10,border:'none',fontSize:12,fontWeight:600,cursor:'pointer',
                    background:muscleFilter===g.id?g.color:'#141D24',
                    color:muscleFilter===g.id?'#080C0E':'#C0CDD4',
                    border:muscleFilter===g.id?'none':'1px solid #1C2730',transition:'all 0.15s'}}>
                  {g.name}
                </button>
              ))}
              <button onClick={()=>{setMuscleFilter('all');setExercise(EXERCISES_AR[0]);}}
                style={{padding:'6px 12px',borderRadius:10,border:'none',fontSize:12,fontWeight:600,cursor:'pointer',
                  background:muscleFilter==='all'?'#E8F0F2':'#141D24',
                  color:muscleFilter==='all'?'#080C0E':'#3D5560',
                  border:muscleFilter==='all'?'none':'1px solid #1C2730'}}>
                الكل
              </button>
            </div>
          </div>

          {/* Step 2 — exercise selector filtered by group */}
          {muscleFilter && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>② اختر التمرين</div>
              {(()=>{
                const filtered = muscleFilter==='all'
                  ? EXERCISES_AR
                  : [...(getExsFlat(muscleGroups.find(g=>g.id===muscleFilter)||{}) || []), 'أخرى'];
                const grp = muscleGroups.find(g=>g.id===muscleFilter);
                return (
                  <>
                    <select value={exercise} onChange={e=>setExercise(e.target.value)}
                      style={{...inp,width:'100%',WebkitAppearance:'none',borderColor:grp?grp.color+'60':'#1C2730'}}>
                      {filtered.map(ex=><option key={ex} value={ex}>{ex}</option>)}
                    </select>
                    {exercise==='أخرى' && <input placeholder="اسم التمرين" value={customEx} onChange={e=>setCustomEx(e.target.value)} style={{...inp,width:'100%',marginTop:8}}/>}
                    {grp && (
                      <div style={{display:'flex',alignItems:'center',gap:6,marginTop:8}}>
                        <div style={{width:8,height:8,borderRadius:'50%',background:grp.color}}/>
                        <span style={{fontSize:11,color:grp.color,fontWeight:600}}>{grp.name}</span>
                      </div>
                    )}
                  </>
                );
              })()}
            </div>
          )}
          {!muscleFilter && (
            <div style={{background:'#141D24',borderRadius:12,padding:'12px 14px',marginBottom:12,textAlign:'center',color:'#3D5560',fontSize:12}}>
              👆 اختر مجموعة عضلية أولاً
            </div>
          )}

          {/* Last session for this exercise */}
          {lastResistance && (
            <div style={{background:'#141D24',borderRadius:12,padding:'10px 14px',marginBottom:14,border:'1px solid #1C2730'}}>
              <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>📅 آخر جلسة — {fmtLastDate(lastResistance.date)}</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {(lastResistance.sets||[]).map((s,i)=>(
                  <div key={i} style={{background:'#1C2730',borderRadius:7,padding:'4px 10px',fontSize:12,fontWeight:600,color:'#C0CDD4'}}>
                    {s.weight}kg × {s.reps}
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{fontSize:10,color:'#3D5560',marginBottom:8}}>الجلسات (وزن كيلو × تكرار)</div>
          {sets.map((s,i)=>(
            <div key={i} style={{display:'flex',gap:8,marginBottom:8,alignItems:'center'}}>
              <div style={{fontSize:11,color:'#00E5A0',fontWeight:800,minWidth:22,textAlign:'center'}}>#{i+1}</div>
              <input type="number" placeholder="وزن" value={s.weight}
                onChange={e=>setSets(sets.map((ss,idx)=>idx===i?{...ss,weight:e.target.value}:ss))}
                style={{...inp,flex:1}}/>
              <span style={{color:'#3D5560',fontSize:16}}>×</span>
              <input type="number" placeholder="تكرار" value={s.reps}
                onChange={e=>setSets(sets.map((ss,idx)=>idx===i?{...ss,reps:e.target.value}:ss))}
                style={{...inp,flex:1}}/>
              {sets.length>1 && <button onClick={()=>setSets(sets.filter((_,idx)=>idx!==i))} style={{background:'none',border:'none',color:'#3D5560',fontSize:18,padding:'0 4px',cursor:'pointer'}}>✕</button>}
            </div>
          ))}
          <button onClick={()=>setSets([...sets,{weight:'',reps:''}])}
            style={{width:'100%',background:'#141D24',border:'1px dashed #1C2730',borderRadius:10,padding:9,color:'#3D5560',fontSize:12,marginBottom:12,cursor:'pointer'}}>
            + إضافة جلسة
          </button>
          <input placeholder="ملاحظات (اختياري)" value={notes} onChange={e=>setNotes(e.target.value)}
            style={{...inp,width:'100%',marginBottom:12}}/>
          <button onClick={submitResistance}
            style={{width:'100%',background:'linear-gradient(135deg,#00C870,#00E5A0)',color:'#080C0E',border:'none',borderRadius:12,padding:13,fontWeight:700,fontSize:14,cursor:'pointer'}}>
            💾 حفظ التمرين
          </button>
        </div>
      )}

      {/* Cardio form */}
      {mode==='cardio' && (
        <div style={{background:'#0E151A',borderRadius:22,padding:16,marginBottom:14,border:'1px solid #1C2730'}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>سجل تمرين الكارديو</div>
          <div style={{fontSize:10,color:'#3D5560',marginBottom:8}}>نوع التمرين</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:7,marginBottom:16}}>
            {CARDIO_TYPES.map(ct=>(
              <button key={ct.ar} onClick={()=>setCardioType(ct)}
                style={{padding:'8px 13px',borderRadius:10,border:'none',fontSize:12,fontWeight:600,cursor:'pointer',
                  background:cardioType.ar===ct.ar?'#00E5A0':'#141D24',
                  color:cardioType.ar===ct.ar?'#080C0E':'#E8F0F2',
                  border:cardioType.ar===ct.ar?'none':'1px solid #1C2730'}}>
                {ct.icon} {ct.ar}
              </button>
            ))}
          </div>
          {/* Last session for this cardio type */}
          {lastCardio && (
            <div style={{background:'#141D24',borderRadius:12,padding:'10px 14px',marginBottom:14,border:'1px solid #1C2730'}}>
              <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>📅 آخر جلسة — {fmtLastDate(lastCardio.date)}</div>
              <div style={{display:'flex',gap:16,fontSize:12,color:'#C0CDD4'}}>
                <span>⏱ {lastCardio.duration} دقيقة</span>
                {lastCardio.distance && <span>📍 {lastCardio.distance} كم</span>}
                {lastCardio.distance && lastCardio.duration && <span>🚀 {(lastCardio.distance/lastCardio.duration*60).toFixed(1)} km/h</span>}
                <span style={{color:'#FF8C42'}}>{lastCardio.caloriesBurned} كال</span>
              </div>
            </div>
          )}
          <div style={{display:'flex',gap:8,marginBottom:8}}>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>المدة (دقيقة) *</div>
              <input type="number" placeholder="30" value={duration} onChange={e=>setDuration(e.target.value)} style={{...inp,width:'100%'}}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>المسافة (كم)</div>
              <input type="number" placeholder="اختياري" value={distance} onChange={e=>setDistance(e.target.value)} style={{...inp,width:'100%'}}/>
            </div>
          </div>
          <div style={{display:'flex',gap:8,marginBottom:12}}>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>متوسط السرعة (km/h)</div>
              <input type="number" placeholder="اختياري" value={avgSpeed} onChange={e=>setAvgSpeed(e.target.value)} style={{...inp,width:'100%'}}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>كالوري محروق (يدوي)</div>
              <input type="number" placeholder={`تلقائي: ${calcCardio()}`} value={manualCalories} onChange={e=>setManualCalories(e.target.value)} style={{...inp,width:'100%'}}/>
            </div>
          </div>
          {duration && (
            <div style={{background:'#141D24',borderRadius:12,padding:'12px 14px',marginBottom:12,display:'flex',gap:24,border:'1px solid #1C2730'}}>
              <div>
                <div style={{fontSize:9,color:'#3D5560'}}>كالوري محروق</div>
                <div style={{fontSize:26,fontWeight:800,fontFamily:'Syne,sans-serif',color:'#FF8C42',lineHeight:1.1}}>{calcCardio()}</div>
              </div>
              {(avgSpeed || speed) && (
                <div>
                  <div style={{fontSize:9,color:'#3D5560'}}>السرعة</div>
                  <div style={{fontSize:26,fontWeight:800,fontFamily:'Syne,sans-serif',lineHeight:1.1}}>{avgSpeed||speed}<span style={{fontSize:11}}>km/h</span></div>
                </div>
              )}
              {manualCalories && (
                <div>
                  <div style={{fontSize:9,color:'#3D5560'}}>محروق (يدوي)</div>
                  <div style={{fontSize:26,fontWeight:800,fontFamily:'Syne,sans-serif',color:'#FF8C42',lineHeight:1.1}}>{manualCalories}</div>
                </div>
              )}
            </div>
          )}
          <input placeholder="ملاحظات (اختياري)" value={cardioNotes} onChange={e=>setCardioNotes(e.target.value)}
            style={{...inp,width:'100%',marginBottom:12}}/>
          <button onClick={submitCardio}
            style={{width:'100%',background:'linear-gradient(135deg,#00C870,#00E5A0)',color:'#080C0E',border:'none',borderRadius:12,padding:13,fontWeight:700,fontSize:14,cursor:'pointer'}}>
            💾 حفظ الكارديو
          </button>
        </div>
      )}

      {/* Today's workouts */}
      <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>تمارين اليوم</div>
      {workouts.length===0 ? (
        <div style={{textAlign:'center',color:'#3D5560',padding:30,fontSize:13,background:'#0E151A',borderRadius:16,border:'1px solid #1C2730'}}>لم تسجل أي تمارين بعد 💪</div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[...workouts].reverse().map(w=>(
            <div key={w.id} style={{background:'#0E151A',borderRadius:14,border:`1px solid ${editingWId===w.id?'#00E5A040':'#1C2730'}`,overflow:'hidden',transition:'border 0.2s'}}>
              {editingWId === w.id ? (
                <div style={{padding:'12px 14px'}}>
                  <div style={{fontSize:12,fontWeight:700,marginBottom:10,color:'#00E5A0'}}>تعديل التمرين</div>
                  {w.type==='resistance' && (
                    <div style={{marginBottom:10}}>
                      <div style={{fontSize:10,color:'#3D5560',marginBottom:6}}>الجلسات (وزن kg × تكرار)</div>
                      {(editWVals.sets||[]).map((s,i)=>(
                        <div key={i} style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                          <span style={{fontSize:11,color:'#00E5A0',minWidth:20,fontWeight:700}}>#{i+1}</span>
                          <input type="number" value={s.weight} onChange={e=>setEditWVals({...editWVals,sets:editWVals.sets.map((ss,idx)=>idx===i?{...ss,weight:e.target.value}:ss)})}
                            style={{...inp,flex:1,padding:'7px 10px'}} placeholder="وزن"/>
                          <span style={{color:'#3D5560',fontSize:16}}>×</span>
                          <input type="number" value={s.reps} onChange={e=>setEditWVals({...editWVals,sets:editWVals.sets.map((ss,idx)=>idx===i?{...ss,reps:e.target.value}:ss)})}
                            style={{...inp,flex:1,padding:'7px 10px'}} placeholder="تكرار"/>
                        </div>
                      ))}
                    </div>
                  )}
                  {w.type==='cardio' && (
                    <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:10}}>
                      {[['duration','المدة (د)'],['distance','المسافة (كم)'],['avgSpeed','السرعة (km/h)']].map(([k,lbl])=>(
                        <div key={k} style={{flex:1,minWidth:80}}>
                          <div style={{fontSize:9,color:'#3D5560',marginBottom:4}}>{lbl}</div>
                          <input type="number" value={editWVals[k]||''} onChange={e=>setEditWVals({...editWVals,[k]:e.target.value})} style={{...inp,width:'100%',padding:'7px 10px'}}/>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{display:'flex',gap:8,marginBottom:8}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:9,color:'#3D5560',marginBottom:4}}>كالوري محروق</div>
                      <input type="number" value={editWVals.caloriesBurned||''} onChange={e=>setEditWVals({...editWVals,caloriesBurned:e.target.value})} style={{...inp,width:'100%',padding:'7px 10px'}}/>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:9,color:'#3D5560',marginBottom:4}}>ملاحظات</div>
                      <input value={editWVals.notes||''} onChange={e=>setEditWVals({...editWVals,notes:e.target.value})} style={{...inp,width:'100%',padding:'7px 10px'}}/>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:8}}>
                    <button onClick={()=>{
                      editWorkout(w.id, {...w, ...editWVals,
                        caloriesBurned: parseFloat(editWVals.caloriesBurned)||w.caloriesBurned,
                        sets: editWVals.sets?.map(s=>({weight:parseFloat(s.weight)||0, reps:parseInt(s.reps)||0})),
                        duration: editWVals.duration ? parseFloat(editWVals.duration) : w.duration,
                        distance: editWVals.distance ? parseFloat(editWVals.distance) : w.distance,
                        avgSpeed: editWVals.avgSpeed ? parseFloat(editWVals.avgSpeed) : w.avgSpeed,
                      });
                      setEditingWId(null);
                    }} style={{flex:1,background:'#00E5A0',color:'#080C0E',border:'none',borderRadius:10,padding:'10px',fontWeight:700,fontSize:13,cursor:'pointer'}}>✓ حفظ</button>
                    <button onClick={()=>setEditingWId(null)} style={{background:'#141D24',color:'#E8F0F2',border:'none',borderRadius:10,padding:'10px 14px',fontSize:13,cursor:'pointer'}}>✕</button>
                  </div>
                </div>
              ) : (
                <div style={{padding:'13px 14px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:w.sets||w.duration?8:0}}>
                    <div style={{fontWeight:700,fontSize:14}}>{w.type==='resistance'?'🏋️':(w.icon||'🏃')} {w.exercise||w.activity}</div>
                    <div style={{fontSize:13,color:'#FF8C42',fontWeight:700}}>{w.caloriesBurned} كال</div>
                  </div>
                  {w.type==='resistance' && w.sets && (
                    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:w.notes?6:0}}>
                      {w.sets.map((s,i)=>(
                        <div key={i} style={{background:'#141D24',borderRadius:8,padding:'5px 11px',fontSize:12,fontWeight:600}}>{s.weight}kg × {s.reps}</div>
                      ))}
                    </div>
                  )}
                  {w.type==='cardio' && (
                    <div style={{display:'flex',flexWrap:'wrap',gap:10,fontSize:12,color:'#3D5560',marginBottom:w.notes?6:0}}>
                      <span>⏱ {w.duration} دقيقة</span>
                      {w.distance && <span>📍 {w.distance} كم</span>}
                      {w.avgSpeed && <span>🚀 {w.avgSpeed} km/h</span>}
                      {!w.avgSpeed&&w.distance&&w.duration && <span>🚀 {(w.distance/w.duration*60).toFixed(1)} km/h</span>}
                    </div>
                  )}
                  {w.notes && <div style={{fontSize:11,color:'#3D5560',marginTop:2}}>📝 {w.notes}</div>}
                  <div style={{display:'flex',alignItems:'center',gap:4,marginTop:6}}>
                    {w.time && <span style={{fontSize:10,color:'#252E38',flex:1}}>{w.time}</span>}
                    <button onClick={()=>{setEditingWId(w.id); setEditWVals({...w, sets: w.sets?.map(s=>({...s}))});}}
                      style={{background:'none',border:'none',color:'#3D5560',fontSize:15,padding:'2px 6px',cursor:'pointer'}}>✏️</button>
                    <button onClick={()=>deleteWorkout(w.id)}
                      style={{background:'none',border:'none',color:'#3D5560',fontSize:15,padding:'2px 6px',cursor:'pointer'}}>🗑</button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

    </div>
  );
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function Progress({logs, weightLog}) {
  const [range, setRange] = useState(7);

  const getDates = n => Array.from({length:n}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate()-(n-1-i));
    return d.toISOString().split('T')[0];
  });

  const dates = getDates(range);

  const calData = dates.map(d => ({
    day:      fmtDay(d),
    date:     fmtDate(d),
    consumed: (logs[d]?.meals||[]).reduce((s,m)=>s+(m.calories||0),0),
    burned:   (logs[d]?.workouts||[]).reduce((s,w)=>s+(w.caloriesBurned||0),0),
  }));

  const protData = dates.map(d => ({
    day:     fmtDay(d),
    protein: (logs[d]?.meals||[]).reduce((s,m)=>s+(m.protein||0),0),
  }));

  const wData = weightLog
    .filter(w => w.date >= dates[0])
    .map(w => ({date: fmtDate(w.date), weight: w.weight}));

  const workoutDays  = dates.filter(d=>(logs[d]?.workouts||[]).length>0).length;
  const avgCal  = Math.round(calData.reduce((s,d)=>s+d.consumed,0) / range);
  const avgProt = Math.round(protData.reduce((s,d)=>s+d.protein,0)  / range);
  const totalBurned  = calData.reduce((s,d)=>s+d.burned,0);
  const tt = {background:'#0E151A',border:'1px solid #1C2730',borderRadius:8,padding:'6px 10px',color:'#E8F0F2',fontSize:11};

  return (
    <div style={{padding:'20px 16px 12px',direction:'rtl'}}>
      <div style={{fontSize:27,fontWeight:800,fontFamily:'Syne,sans-serif',letterSpacing:'-0.5px',marginBottom:18}}>التحليل 📈</div>

      {/* Range */}
      <div style={{background:'#0E151A',borderRadius:16,padding:12,marginBottom:18,border:'1px solid #1C2730'}}>
        <div style={{display:'flex',gap:6,marginBottom:10}}>
          {[7,14,30,90].map(r=>(
            <button key={r} onClick={()=>setRange(r)}
              style={{flex:1,padding:'8px 4px',borderRadius:9,border:'none',fontSize:11,fontWeight:700,
                background:range===r?'#00E5A0':'#141D24',color:range===r?'#080C0E':'#3D5560',cursor:'pointer',transition:'all 0.15s'}}>
              {r}
            </button>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <button onClick={()=>setRange(r=>Math.max(1,r-1))}
            style={{width:38,height:38,borderRadius:10,border:'none',background:'#141D24',color:'#E8F0F2',fontSize:20,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>−</button>
          <div style={{flex:1,textAlign:'center'}}>
            <div style={{fontSize:22,fontWeight:800,fontFamily:'Syne,sans-serif',color:'#00E5A0',lineHeight:1}}>{range}</div>
            <div style={{fontSize:10,color:'#3D5560',marginTop:2}}>يوم</div>
          </div>
          <button onClick={()=>setRange(r=>Math.min(180,r+1))}
            style={{width:38,height:38,borderRadius:10,border:'none',background:'#141D24',color:'#E8F0F2',fontSize:20,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>+</button>
        </div>
      </div>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
        {[{l:'متوسط السعرات',v:avgCal,u:'كال',c:'#00E5A0',note:`هدف ${PROFILE.dailyCalories}`},
          {l:'متوسط البروتين',v:avgProt,u:'g',c:'#5B9CF6',note:`هدف ${PROFILE.dailyProtein}g`},
          {l:'أيام التمرين',v:workoutDays,u:`/${range}`,c:'#FF8C42',note:'يوم مكتمل'},
          {l:'إجمالي المحروق',v:totalBurned,u:'كال',c:'#FF5D5D',note:`آخر ${range} أيام`},
        ].map(s=>(
          <div key={s.l} style={{background:'#0E151A',borderRadius:16,padding:14,border:'1px solid #1C2730'}}>
            <div style={{fontSize:9,color:'#3D5560',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.5px'}}>{s.l}</div>
            <div style={{fontSize:22,fontWeight:800,fontFamily:'Syne,sans-serif',color:s.c,lineHeight:1}}>{s.v}<span style={{fontSize:11,fontWeight:400,marginRight:2}}>{s.u}</span></div>
            <div style={{fontSize:9,color:'#3D5560',marginTop:4}}>{s.note}</div>
          </div>
        ))}
      </div>

      {/* Weight chart */}
      {wData.length > 1 && (
        <div style={{background:'#0E151A',borderRadius:20,padding:16,marginBottom:12,border:'1px solid #1C2730'}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>⚖️ منحنى الوزن</div>
          <ResponsiveContainer width="100%" height={140}>
            <AreaChart data={wData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1C2730"/>
              <XAxis dataKey="date" tick={{fill:'#3D5560',fontSize:9}}/>
              <YAxis tick={{fill:'#3D5560',fontSize:9}} domain={['auto','auto']}/>
              <Tooltip contentStyle={tt}/>
              <Area type="monotone" dataKey="weight" name="الوزن (kg)" stroke="#00E5A0" fill="#00E5A010" strokeWidth={2.5}/>
            </AreaChart>
          </ResponsiveContainer>
        </div>
      )}

      {/* Calories chart */}
      <div style={{background:'#0E151A',borderRadius:20,padding:16,marginBottom:12,border:'1px solid #1C2730'}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>🔥 السعرات اليومية</div>
        <div style={{fontSize:10,color:'#3D5560',marginBottom:12}}>
          <span style={{color:'#00E5A0'}}>■</span> مستهلك &nbsp;
          <span style={{color:'#FF8C42'}}>■</span> محروق &nbsp;
          <span style={{color:'#3D5560'}}>-- </span> هدف {PROFILE.dailyCalories}
        </div>
        <ResponsiveContainer width="100%" height={150}>
          <BarChart data={calData} barSize={12} barGap={2}>
            <CartesianGrid strokeDasharray="3 3" stroke="#1C2730"/>
            <XAxis dataKey="day" tick={{fill:'#3D5560',fontSize:9}}/>
            <YAxis tick={{fill:'#3D5560',fontSize:9}}/>
            <Tooltip contentStyle={tt}/>
            <ReferenceLine y={PROFILE.dailyCalories} stroke="#3D5560" strokeDasharray="4 4"/>
            <Bar dataKey="consumed" name="مستهلك" fill="#00E5A0" radius={[4,4,0,0]}/>

        {(()=>{
          // Thick-limb figure helper. hx,hy = hip center
          const Fig = ({hx,hy,ta=0,ual=-20,uar=-20,fal=0,far2=0,thl=0,thr=0,shl=0,shr=0}) => {
            const R=a=>a*Math.PI/180;
            const px=(a,l,bx)=>bx+Math.sin(R(a))*l;
            const py=(a,l,by)=>by-Math.cos(R(a))*l;
            const tsx=px(ta,36,hx),    tsy=py(ta,36,hx,hy)-(36-36)+hy- Math.cos(R(ta))*36;
            // Recalculate correctly
            const torsoX = hx + Math.sin(R(ta))*36;
            const torsoY = hy - Math.cos(R(ta))*36;
            const headX  = hx + Math.sin(R(ta))*52;
            const headY  = hy - Math.cos(R(ta))*52;
            const shldX  = hx + Math.sin(R(ta))*28;
            const shldY  = hy - Math.cos(R(ta))*28;
            // Arms
            const ulx = shldX + Math.cos(R(ual+ta-90))*22;
            const uly = shldY + Math.sin(R(ual+ta-90))*22;
            const urx = shldX - Math.cos(R(uar+ta-90))*22;
            const ury = shldY + Math.sin(R(uar+ta-90))*22;
            const flx = ulx + Math.sin(R(ual+ta+fal))*18;
            const fly = uly + Math.cos(R(ual+ta+fal))*18;
            const frx = urx + Math.sin(R(uar+ta+far2))*18;
            const fry = ury + Math.cos(R(uar+ta+far2))*18;
            // Legs
            const llhx=hx-7, llhy=hy;
            const lkx=llhx+Math.sin(R(thl))*26, lky=llhy+Math.cos(R(thl))*26;
            const lfx=lkx+Math.sin(R(thl+shl))*24, lfy=lky+Math.cos(R(thl+shl))*24;
            const rlhx=hx+7, rlhy=hy;
            const rkx=rlhx+Math.sin(R(thr))*26, rky=rlhy+Math.cos(R(thr))*26;
            const rfx=rkx+Math.sin(R(thr+shr))*24, rfy=rky+Math.cos(R(thr+shr))*24;
            return (
              <g>
                <line x1={llhx} y1={llhy} x2={lkx}   y2={lky}   stroke={SS} strokeWidth="11" strokeLinecap="round"/>
                <line x1={lkx}  y1={lky}  x2={lfx}   y2={lfy}   stroke={SS} strokeWidth="9"  strokeLinecap="round"/>
                <line x1={rlhx} y1={rlhy} x2={rkx}   y2={rky}   stroke={SS} strokeWidth="11" strokeLinecap="round"/>
