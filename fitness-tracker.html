// ── EXERCISE MODAL ─────────────────────────────────────────────────────────────
function ExerciseModal({ exercise, groupColor, onClose }) {
  const [info,    setInfo]    = useState(null);
  const [loading, setLoading] = useState(true);
  const highlights = EXERCISE_MUSCLES_SVG[exercise] || [];

  useEffect(() => {
    if (!exercise) return;
    setLoading(true); setInfo(null);
    fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1500,
        messages: [{
          role: "user",
          content: `أنت مدرب لياقة بدنية خبير. اشرح تمرين "${exercise}" باللغة العربية.
أجب فقط بـ JSON بدون أي نص إضافي أو backticks:
{
  "description": "وصف مختصر للتمرين في جملة واحدة",
  "muscles": ["العضلة الرئيسية", "عضلة مساعدة 1", "عضلة مساعدة 2"],
  "equipment": ["الأداة أو الجهاز الرئيسي", "بديل اختياري"],
  "equipment_note": "ملاحظة مختصرة عن ضبط الجهاز أو الأداة إن وجدت",
  "steps": ["الخطوة 1 — الوضعية الابتدائية", "الخطوة 2 — الحركة", "الخطوة 3", "الخطوة 4 — العودة"],
  "tips": ["نصيحة تقنية 1", "نصيحة تقنية 2"]
}`
        }]
      })
    }).then(r=>r.json()).then(d=>{
      try { setInfo(JSON.parse(d.content[0].text.replace(/```json|```/g,'').trim())); }
      catch(e) {}
      setLoading(false);
    }).catch(()=>setLoading(false));
  }, [exercise]);

  if (!exercise) return null;

  return (
    <div style={{position:'fixed',inset:0,background:'#000000CC',zIndex:300,display:'flex',alignItems:'flex-end',direction:'rtl'}}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:'#0D1318',borderRadius:'24px 24px 0 0',width:'100%',maxWidth:440,margin:'0 auto',maxHeight:'85vh',overflowY:'auto',paddingBottom:'env(safe-area-inset-bottom,16px)'}}>
        <div style={{display:'flex',justifyContent:'center',paddingTop:12,paddingBottom:4}}>
          <div style={{width:36,height:4,borderRadius:2,background:'#1C2730'}}/>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 18px 16px',borderBottom:'1px solid #1C2730'}}>
          <div style={{width:12,height:12,borderRadius:'50%',background:groupColor,flexShrink:0}}/>
          <div style={{flex:1,fontSize:18,fontWeight:800,fontFamily:'Syne,sans-serif'}}>{exercise}</div>
          {/* YouTube button */}
          <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(ytQuery(exercise))}`}
             target="_blank" rel="noopener noreferrer"
             style={{display:'flex',alignItems:'center',gap:5,background:'#FF0000',color:'#fff',border:'none',borderRadius:8,padding:'6px 10px',fontSize:11,fontWeight:700,cursor:'pointer',textDecoration:'none',flexShrink:0}}>
            ▶ يوتيوب
          </a>
          <button onClick={onClose} style={{background:'#1C2730',border:'none',borderRadius:8,width:32,height:32,color:'#E8F0F2',fontSize:16,cursor:'pointer'}}>✕</button>
        </div>

        <div style={{padding:'16px 18px'}}>

          {/* YouTube prominent link */}
          <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(ytQuery(exercise))}`}
             target="_blank" rel="noopener noreferrer"
             style={{display:'flex',alignItems:'center',gap:12,background:'#FF000015',border:'1px solid #FF000040',borderRadius:14,padding:'12px 14px',marginBottom:14,textDecoration:'none'}}>
            <div style={{width:44,height:34,background:'#FF0000',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <span style={{color:'#fff',fontSize:16}}>▶</span>
            </div>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:'#E8F0F2',marginBottom:2}}>شاهد شرح الفيديو على يوتيوب</div>
              <div style={{fontSize:10,color:'#3D5560'}}>اضغط لتشاهد طريقة الأداء الصحيحة</div>
            </div>
          </a>

          {loading ? (
            <div style={{textAlign:'center',padding:20,color:'#3D5560'}}>
              <div style={{fontSize:24,marginBottom:6}}>⏳</div>
              <div style={{fontSize:12}}>جاري تحميل الشرح...</div>
            </div>
          ) : info ? (
            <>
              {/* Description */}
              <div style={{background:'#141D24',borderRadius:14,padding:'11px 14px',marginBottom:10,border:`1px solid ${groupColor}30`}}>
                <div style={{fontSize:11,color:groupColor,fontWeight:700,marginBottom:5}}>عن التمرين</div>
                <div style={{fontSize:12,color:'#C0CDD4',lineHeight:1.7}}>{info.description}</div>
              </div>

              {/* Equipment details */}
              {info.equipment?.length > 0 && (
                <div style={{background:'#141D24',borderRadius:14,padding:'11px 14px',marginBottom:10,border:'1px solid #1C2730'}}>
                  <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:8}}>
                    <span style={{fontSize:13}}>🏋️</span>
                    <span style={{fontSize:11,fontWeight:700,color:'#E8F0F2'}}>الأدوات</span>
                  </div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:5,marginBottom:info.equipment_note?6:0}}>
                    {info.equipment.map((eq,i)=>(
                      <div key={i} style={{background:i===0?'#FF8C4220':'#1C2730',border:`1px solid ${i===0?'#FF8C4250':'#252E38'}`,borderRadius:7,padding:'4px 10px',fontSize:11,color:i===0?'#FF8C42':'#C0CDD4',fontWeight:i===0?600:400}}>{eq}</div>
                    ))}
                  </div>
                  {info.equipment_note && <div style={{fontSize:11,color:'#3D5560',lineHeight:1.6}}>⚙️ {info.equipment_note}</div>}
                </div>
              )}

              {/* Steps */}
              {info.steps?.length > 0 && (
                <div style={{background:'#141D24',borderRadius:14,padding:'11px 14px',marginBottom:10,border:'1px solid #1C2730'}}>
                  <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:10}}>
                    <span style={{fontSize:13}}>▶️</span>
                    <span style={{fontSize:11,fontWeight:700,color:'#E8F0F2'}}>خطوات الأداء</span>
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {info.steps.map((step,i)=>(
                      <div key={i} style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                        <div style={{width:22,height:22,borderRadius:'50%',background:groupColor,color:'#080C0E',fontSize:11,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}}>{i+1}</div>
                        <div style={{fontSize:12,color:'#C0CDD4',lineHeight:1.65,flex:1,paddingTop:3}}>{step}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Tips */}
              {info.tips?.length > 0 && (
                <div style={{background:'#141D24',borderRadius:14,padding:'11px 14px',border:'1px solid #1C2730'}}>
                  <div style={{fontSize:11,color:'#FFE66D',fontWeight:700,marginBottom:8}}>💡 نصائح تقنية</div>
                  {info.tips.map((tip,i)=>(
                    <div key={i} style={{fontSize:12,color:'#C0CDD4',lineHeight:1.6,marginBottom:i<info.tips.length-1?7:0,display:'flex',gap:6}}>
                      <span style={{color:'#FFE66D',flexShrink:0}}>•</span><span>{tip}</span>
                    </div>
                  ))}
                </div>
              )}
            </>
          ) : (
            <div style={{textAlign:'center',padding:20,color:'#3D5560',fontSize:13}}>تعذّر تحميل الشرح، حاول مرة أخرى</div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── MUSCLE MAP ────────────────────────────────────────────────────────────────
function MuscleMap({ logs, muscleGroups, saveMuscleGroups }) {
  const [editMode,    setEditMode]    = useState(false);
  const [range,       setRange]       = useState(7);
  const [mergeSource, setMergeSource] = useState(null);
  const [moveEx,      setMoveEx]      = useState(null);
  const [renamingId,  setRenamingId]  = useState(null);
  const [renameVal,   setRenameVal]   = useState('');
  const [selectedEx,       setSelectedEx]       = useState(null);
  const [selectedGrpColor,  setSelectedGrpColor]  = useState('#00E5A0');
  const [renamingEx,        setRenamingEx]        = useState(null); // {exercise, groupId, subIdx}
  const [renameExVal,       setRenameExVal]       = useState('');
  const [aiExInput,        setAiExInput]        = useState('');
  const [aiExLoading,      setAiExLoading]      = useState(false);
  const [aiExResult,       setAiExResult]       = useState(null);
  const [aiExError,        setAiExError]        = useState('');

  const getLastTrained = (group) => {
    const dates = Object.keys(logs).sort().reverse();
    for (const date of dates) {
      if ((logs[date]?.workouts||[]).some(w => w.type==='resistance' && getExs(group).includes(w.exercise)))
        return date;
    }
    return null;
  };

  const trainedInRange = (group) => {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - range);
    const cutoffStr = cutoff.toISOString().split('T')[0];
    return Object.keys(logs).some(date =>
      date >= cutoffStr &&
(logs[date]?.workouts||[]).some(w => w.type==='resistance' && getExs(group).includes(w.exercise))
    );
  };

  const statusColor = (days) => {
    if (days === null) return '#2A3540';
    if (days <= 2) return '#00E5A0';
    if (days <= 5) return '#FFE66D';
    return '#FF6B6B';
  };

  const statusLabel = (days) => {
    if (days === null) return 'لم تتمرن بعد';
    if (days === 0) return 'اليوم ✓';
    if (days === 1) return 'أمس';
    return `منذ ${days} أيام`;
  };

  // Helper: get all exercises flat from group (supports subGroups)
  const getExs = (g) => g.subGroups ? g.subGroups.flatMap(sg=>sg.exercises||[]) : (g.exercises||[]);

  const mergeGroups = (sourceId, targetId) => {
    const source = muscleGroups.find(g => g.id === sourceId);
    const target = muscleGroups.find(g => g.id === targetId);
    const targetSubs = target.subGroups || [{name: target.name, exercises: target.exercises||[]}];
    const sourceSubs = source.subGroups || [{name: source.name, exercises: source.exercises||[]}];
    const newName = target.name + ' + ' + source.name;
    saveMuscleGroups(
      muscleGroups.filter(g => g.id !== sourceId)
        .map(g => g.id === targetId ? {...g, name: newName, subGroups: [...targetSubs, ...sourceSubs], exercises: undefined} : g)
    );
    setMergeSource(null);
  };

  const moveExercise = (exercise, fromId, toId) => {
    saveMuscleGroups(muscleGroups.map(g => {
      if (g.id === fromId) {
        if (g.subGroups) return {...g, subGroups: g.subGroups.map(sg=>({...sg,exercises:sg.exercises.filter(e=>e!==exercise)})).filter(sg=>sg.exercises.length>0)};
        return {...g, exercises: g.exercises.filter(e => e !== exercise)};
      }
      if (g.id === toId) {
        if (g.subGroups) return {...g, subGroups:[...g.subGroups, {name:'منقول', exercises:[exercise]}]};
        return {...g, exercises: [...g.exercises, exercise]};
      }
      return g;
    }));
    setMoveEx(null);
  };

  const splitGroup = (groupId) => {
    const group = muscleGroups.find(g => g.id === groupId);
    if (!group.subGroups || group.subGroups.length < 2) return;
    const usedColors = muscleGroups.filter(g=>g.id!==groupId).map(g => g.color);
    let colorIdx = 0;
    const newGroups = group.subGroups
      .filter(sg => (sg.exercises||[]).length > 0)
      .map((sg, i) => {
        const color = GROUP_COLORS.find(c => !usedColors.includes(c)) || GROUP_COLORS[colorIdx++ % GROUP_COLORS.length];
        usedColors.push(color);
        return { id: 'grp_' + Date.now() + '_' + i, name: sg.name || (group.name + ' ' + (i+1)), color, exercises: sg.exercises||[] };
      });
    saveMuscleGroups([...muscleGroups.filter(g => g.id !== groupId), ...newGroups]);
  };

  const addGroup = () => {
    const newId = 'grp_' + Date.now();
    const used = muscleGroups.map(g => g.color);
    const color = GROUP_COLORS.find(c => !used.includes(c)) || GROUP_COLORS[0];
    saveMuscleGroups([...muscleGroups, {id:newId, name:'مجموعة جديدة', color, exercises:[]}]);
    setRenamingId(newId); setRenameVal('');
  };

  const renameExercise = (oldName, newName, groupId, subIdx) => {
    if (!newName.trim() || newName === oldName) { setRenamingEx(null); return; }
    saveMuscleGroups(muscleGroups.map(g => {
      if (g.id !== groupId) return g;
      if (g.subGroups) {
        return {...g, subGroups: g.subGroups.map((sg, i) =>
          i === subIdx ? {...sg, exercises: sg.exercises.map(e => e === oldName ? newName.trim() : e)} : sg
        )};
      }
      return {...g, exercises: (g.exercises||[]).map(e => e === oldName ? newName.trim() : e)};
    }));
    setRenamingEx(null);
  };

  const classifyExercise = async () => {
    if (!aiExInput.trim()) return;
    setAiExLoading(true); setAiExResult(null); setAiExError('');
    const groupNames = muscleGroups.map(g => g.name).join('، ');
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:500,
          messages:[{role:"user", content:`أنت مدرب لياقة بدنية خبير. المجموعات العضلية المتاحة هي: ${groupNames}.

صنّف هذا التمرين أو الجهاز: "${aiExInput}"

أجب فقط بـ JSON بدون أي نص إضافي:
{"exerciseName": "اسم التمرين بالأحرف العربية (مثال: بوش آب، هيب ثراست، كيبل كروس أوفر) — تحويل صوتي وليس ترجمة", "groupName": "اسم المجموعة العضلية من القائمة المتاحة فقط", "reason": "سبب التصنيف في جملة قصيرة"}`}]
        })
      });
      const data = await res.json();
      const result = JSON.parse(data.content[0].text.replace(/```json|```/g,'').trim());
      setAiExResult(result);
    } catch(e) { setAiExError('حدث خطأ، حاول مرة أخرى'); }
    setAiExLoading(false);
  };

  const confirmAddExercise = () => {
    if (!aiExResult) return;
    const targetGroup = muscleGroups.find(g => g.name === aiExResult.groupName);
    if (!targetGroup) { setAiExError('ما قدرت أحدد المجموعة، حاول مرة ثانية'); return; }
    const exName = aiExResult.exerciseName;
    if (getExs(targetGroup).includes(exName)) { setAiExError('التمرين موجود بالفعل في هذه المجموعة'); return; }
    saveMuscleGroups(muscleGroups.map(g =>
      g.id === targetGroup.id
        ? g.subGroups
          ? {...g, subGroups: [...g.subGroups.slice(0,-1), {...g.subGroups[g.subGroups.length-1], exercises:[...g.subGroups[g.subGroups.length-1].exercises, exName]}]}
          : {...g, exercises: [...(g.exercises||[]), exName]}
        : g
    ));
    setAiExResult(null); setAiExInput('');
  };

  const coveredCount = muscleGroups.filter(g => getExs(g).length > 0 && trainedInRange(g)).length;
  const totalCount   = muscleGroups.filter(g => getExs(g).length > 0).length;
  const inp = {background:'#141D24',border:'1px solid #1C2730',borderRadius:8,padding:'4px 10px',color:'#E8F0F2',fontSize:13,fontWeight:700,outline:'none',width:'100%'};

  return (
    <div style={{padding:'20px 16px 12px', direction:'rtl'}}>
      {/* Exercise detail modal */}
      {selectedEx && (
        <ExerciseModal exercise={selectedEx} groupColor={selectedGrpColor} onClose={()=>setSelectedEx(null)}/>
      )}

      {/* AI Exercise Classifier */}
      <div style={{background:'#0E151A',borderRadius:20,padding:16,marginBottom:16,border:'1px solid #1C2730'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <div style={{width:28,height:28,borderRadius:8,background:'linear-gradient(135deg,#00E5A0,#3B6FD8)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0}}>🤖</div>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>مصنّف التمارين الذكي</div>
            <div style={{fontSize:10,color:'#3D5560'}}>أدخل اسم تمرين أو جهاز ويصنّفه تلقائياً</div>
          </div>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:aiExResult||aiExError?10:0}}>
          <input value={aiExInput} onChange={e=>setAiExInput(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&classifyExercise()}
            placeholder="مثال: Cable Fly، جهاز الصدر، Hip Thrust..."
            style={{flex:1,background:'#141D24',border:'1px solid #1C2730',borderRadius:10,padding:'10px 12px',color:'#E8F0F2',fontSize:13,outline:'none'}}/>
          <button onClick={classifyExercise} disabled={aiExLoading||!aiExInput.trim()}
            style={{background:aiExLoading||!aiExInput.trim()?'#1C2730':'linear-gradient(135deg,#00C870,#00E5A0)',color:aiExLoading||!aiExInput.trim()?'#3D5560':'#080C0E',border:'none',borderRadius:10,padding:'10px 14px',fontWeight:700,fontSize:13,cursor:'pointer',flexShrink:0}}>
            {aiExLoading?'⏳':'⚡'}
          </button>
        </div>
        {aiExError && <div style={{fontSize:11,color:'#FF4444',marginBottom:8}}>{aiExError}</div>}
        {aiExResult && (
          <div style={{background:'#141D24',borderRadius:14,padding:14,border:'1px solid #00E5A030'}}>
            <div style={{fontSize:14,fontWeight:800,color:'#00E5A0',marginBottom:4}}>{aiExResult.exerciseName}</div>
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:6}}>
              {(()=>{const g=muscleGroups.find(g=>g.name===aiExResult.groupName); return g ? <><div style={{width:8,height:8,borderRadius:'50%',background:g.color}}/><span style={{fontSize:12,color:g.color,fontWeight:600}}>{g.name}</span></> : <span style={{fontSize:12,color:'#3D5560'}}>{aiExResult.groupName}</span>;})()}
            </div>
            <div style={{fontSize:11,color:'#3D5560',marginBottom:12}}>{aiExResult.reason}</div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={confirmAddExercise}
                style={{flex:1,background:'#00E5A0',color:'#080C0E',border:'none',borderRadius:10,padding:'10px',fontWeight:700,fontSize:13,cursor:'pointer'}}>
                ✅ أضف للقائمة
              </button>
              <button onClick={()=>{setAiExResult(null);setAiExInput('');}}
                style={{background:'#1C2730',color:'#E8F0F2',border:'none',borderRadius:10,padding:'10px 14px',fontSize:13,cursor:'pointer'}}>✕</button>
            </div>
          </div>
        )}
      </div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:18}}>
        <div>
          <div style={{fontSize:27, fontWeight:800, fontFamily:'Syne,sans-serif', letterSpacing:'-0.5px'}}>العضلات 💪</div>
          <div style={{fontSize:11, color:'#3D5560', marginTop:4}}>
            {coveredCount}/{totalCount} مجموعة خلال آخر {range} أيام
          </div>
        </div>
        <button onClick={()=>{setEditMode(!editMode);setMergeSource(null);setMoveEx(null);}}
          style={{background:editMode?'#00E5A0':'#141D24', color:editMode?'#080C0E':'#E8F0F2',
            border:'none', borderRadius:10, padding:'8px 16px', fontSize:12, fontWeight:700, cursor:'pointer'}}>
          {editMode ? '✓ حفظ' : '✏️ تعديل'}
        </button>
      </div>

      {/* Range stepper */}
      {!editMode && (
        <div style={{background:'#0E151A',borderRadius:14,padding:'10px 14px',marginBottom:16,border:'1px solid #1C2730',display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:11,color:'#3D5560',flex:1}}>الفترة</span>
          {[7,14,30].map(r=>(
            <button key={r} onClick={()=>setRange(r)}
              style={{padding:'5px 10px',borderRadius:8,border:'none',fontSize:11,fontWeight:700,
                background:range===r?'#1C2730':'none',color:range===r?'#00E5A0':'#3D5560',cursor:'pointer'}}>
              {r}
            </button>
          ))}
          <button onClick={()=>setRange(r=>Math.max(1,r-1))}
            style={{width:30,height:30,borderRadius:8,border:'none',background:'#141D24',color:'#E8F0F2',fontSize:16,cursor:'pointer'}}>−</button>
          <span style={{fontSize:15,fontWeight:800,fontFamily:'Syne,sans-serif',color:'#00E5A0',minWidth:50,textAlign:'center'}}>{range}d</span>
          <button onClick={()=>setRange(r=>Math.min(90,r+1))}
            style={{width:30,height:30,borderRadius:8,border:'none',background:'#141D24',color:'#E8F0F2',fontSize:16,cursor:'pointer'}}>+</button>
        </div>
      )}

      {/* Groups */}
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {muscleGroups.map(group => {
          const lastDate   = getLastTrained(group);
          const days       = daysSince(lastDate);
          const inRange    = trainedInRange(group);
          const sColor     = statusColor(days);
          const isMergeSrc = mergeSource === group.id;

          return (
            <div key={group.id} style={{background:'#0E151A',borderRadius:18,padding:14,border:`1px solid ${editMode ? group.color+'50' : inRange ? group.color+'30' : '#1C2730'}`,transition:'border 0.2s'}}>
              {/* Header row */}
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:getExs(group).length>0?10:0}}>
                <div style={{width:11,height:11,borderRadius:'50%',background:group.color,flexShrink:0}}/>

                {editMode && renamingId === group.id ? (
                  <input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                    onBlur={()=>{saveMuscleGroups(muscleGroups.map(g=>g.id===group.id?{...g,name:renameVal||g.name}:g));setRenamingId(null);}}
                    onKeyDown={e=>e.key==='Enter'&&(saveMuscleGroups(muscleGroups.map(g=>g.id===group.id?{...g,name:renameVal||g.name}:g)),setRenamingId(null))}
                    style={inp}/>
                ) : (
                  <span style={{flex:1,fontSize:14,fontWeight:700,cursor:editMode?'pointer':'default'}}
                    onClick={()=>editMode&&(setRenamingId(group.id),setRenameVal(group.name))}>
                    {group.name}{editMode&&<span style={{color:'#3D5560',fontSize:11,marginRight:4}}>✎</span>}
                  </span>
                )}

                {!editMode && (
                  <span style={{fontSize:11,color:sColor,fontWeight:600}}>{statusLabel(days)}</span>
                )}

                {editMode && (
                  <div style={{display:'flex',gap:6,position:'relative'}}>
                    {/* Merge dropdown */}
                    <div style={{position:'relative'}}>
                      <button onClick={()=>setMergeSource(isMergeSrc?null:group.id)}
                        style={{background:isMergeSrc?'#FFE66D':'#141D24',color:isMergeSrc?'#080C0E':'#3D5560',border:'none',borderRadius:8,padding:'5px 9px',fontSize:11,cursor:'pointer',fontWeight:600}}>
                        دمج ▾
                      </button>
                      {isMergeSrc && (
                        <div style={{position:'absolute',left:0,top:'100%',marginTop:4,background:'#1A2430',borderRadius:12,padding:6,zIndex:200,minWidth:130,boxShadow:'0 8px 24px #00000080',border:'1px solid #1C2730'}}>
                          <div style={{fontSize:10,color:'#3D5560',padding:'4px 8px 6px'}}>دمج مع:</div>
                          {muscleGroups.filter(g=>g.id!==group.id).map(g=>(
                            <div key={g.id} onClick={()=>mergeGroups(group.id,g.id)}
                              style={{padding:'8px 10px',borderRadius:8,cursor:'pointer',fontSize:12,display:'flex',alignItems:'center',gap:8,color:'#E8F0F2'}}
                              onMouseOver={e=>e.currentTarget.style.background='#252E38'}
                              onMouseOut={e=>e.currentTarget.style.background='none'}>
                              <div style={{width:8,height:8,borderRadius:'50%',background:g.color,flexShrink:0}}/>
                              {g.name}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                    {/* Split button — only for merged groups */}
                    {group.subGroups && group.subGroups.length > 1 && (
                      <button onClick={()=>splitGroup(group.id)}
                        style={{background:'#141D24',color:'#95E1D3',border:'1px solid #95E1D330',borderRadius:8,padding:'5px 9px',fontSize:11,cursor:'pointer',fontWeight:600}}>
                        فصل
                      </button>
                    )}
                    {/* Delete empty group */}
                    {getExs(group).length === 0 && (
                      <button onClick={()=>saveMuscleGroups(muscleGroups.filter(g=>g.id!==group.id))}
                        style={{background:'#FF444420',color:'#FF6B6B',border:'none',borderRadius:8,padding:'5px 8px',fontSize:12,cursor:'pointer'}}>✕</button>
                    )}
                  </div>
                )}
              </div>

              {/* Exercise tags — supports subGroups */}
              {(()=>{
                const subs = group.subGroups || [{name:null, exercises:group.exercises||[]}];
                const allExs = getExs(group);
                if (allExs.length === 0) return <div style={{fontSize:11,color:'#252E38'}}>{editMode?'فارغة — احذفها أو أضف تمارين':'لا توجد تمارين'}</div>;
                return (
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {subs.filter(sg=>(sg.exercises||[]).length>0).map((sg,si)=>(
                      <div key={si}>
                        {group.subGroups && sg.name && (
                          <div style={{fontSize:10,color:group.color,fontWeight:700,marginBottom:5,opacity:0.85}}>{sg.name}</div>
                        )}
                        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                          {(sg.exercises||[]).map(ex=>{
                            const isRenamingThis = renamingEx?.exercise===ex && renamingEx?.groupId===group.id && renamingEx?.subIdx===si;
                            return (
                              <div key={ex} style={{display:'flex',alignItems:'center',gap:3,background:'#141D24',borderRadius:8,padding:'4px 6px 4px 10px',border:`1px solid ${isRenamingThis?group.color+'80':group.color+'25'}`,cursor:editMode?'default':'pointer',transition:'border 0.15s'}}
                                onClick={()=>!editMode&&(setSelectedEx(ex),setSelectedGrpColor(group.color))}
                                onMouseOver={e=>{ if(!editMode) e.currentTarget.style.borderColor=group.color+'80'; }}
                                onMouseOut={e=>{ if(!isRenamingThis) e.currentTarget.style.borderColor=group.color+'25'; }}>
                                {editMode && isRenamingThis ? (
                                  <input autoFocus value={renameExVal}
                                    onChange={e=>setRenameExVal(e.target.value)}
                                    onBlur={()=>renameExercise(ex, renameExVal, group.id, si)}
                                    onKeyDown={e=>{
                                      if(e.key==='Enter') renameExercise(ex, renameExVal, group.id, si);
                                      if(e.key==='Escape') setRenamingEx(null);
                                    }}
                                    style={{background:'none',border:'none',color:'#E8F0F2',fontSize:11,outline:'none',width:`${Math.max(renameExVal.length,4)}ch`,minWidth:40}}/>
                                ) : (
                                  <span style={{fontSize:11,color:'#C0CDD4'}}
                                    onDoubleClick={()=>editMode&&(setRenamingEx({exercise:ex,groupId:group.id,subIdx:si}),setRenameExVal(ex))}>
                                    {ex}
                                  </span>
                                )}
                                {editMode && !isRenamingThis && (
                                  <div style={{display:'flex',gap:1}}>
                                    {/* Rename button */}
                                    <button
                                      onClick={()=>{setRenamingEx({exercise:ex,groupId:group.id,subIdx:si});setRenameExVal(ex);}}
                                      title="تعديل الاسم"
                                      style={{background:'none',border:'none',color:'#3D5560',fontSize:10,cursor:'pointer',padding:'0 2px',lineHeight:1}}>✎</button>
                                    {/* Move button */}
                                    <div style={{position:'relative'}}>
                                      <button onClick={()=>setMoveEx(moveEx?.exercise===ex&&moveEx?.fromGroupId===group.id?null:{exercise:ex,fromGroupId:group.id})}
                                        style={{background:'none',border:'none',color:'#3D5560',fontSize:11,cursor:'pointer',padding:'0 2px',lineHeight:1}}>↗</button>
                                      {moveEx?.exercise===ex && moveEx?.fromGroupId===group.id && (
                                        <div style={{position:'absolute',left:0,top:'100%',marginTop:2,background:'#1A2430',borderRadius:12,padding:6,zIndex:200,minWidth:130,boxShadow:'0 8px 24px #00000080',border:'1px solid #1C2730'}}>
                                          <div style={{fontSize:10,color:'#3D5560',padding:'4px 8px 6px'}}>نقل إلى:</div>
                                          {muscleGroups.filter(g2=>g2.id!==group.id).map(g2=>(
                                            <div key={g2.id} onClick={()=>moveExercise(ex,group.id,g2.id)}
                                              style={{padding:'8px 10px',borderRadius:8,cursor:'pointer',fontSize:12,display:'flex',alignItems:'center',gap:8,color:'#E8F0F2'}}
                                              onMouseOver={e=>e.currentTarget.style.background='#252E38'}
                                              onMouseOut={e=>e.currentTarget.style.background='none'}>
                                              <div style={{width:8,height:8,borderRadius:'50%',background:g2.color,flexShrink:0}}/>{g2.name}
                                            </div>
                                          ))}
                                        </div>
                                      )}
                                    </div>
                                    {/* Delete button */}
                                    <button
                                      onClick={()=>saveMuscleGroups(muscleGroups.map(g=>
                                        g.id!==group.id?g:
                                        g.subGroups?{...g,subGroups:g.subGroups.map((sg2,i2)=>i2===si?{...sg2,exercises:sg2.exercises.filter(e=>e!==ex)}:sg2)}:
                                        {...g,exercises:(g.exercises||[]).filter(e=>e!==ex)}
                                      ))}
                                      title="حذف التمرين"
                                      style={{background:'none',border:'none',color:'#3D5560',fontSize:10,cursor:'pointer',padding:'0 2px',lineHeight:1}}>✕</button>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                        {si < subs.filter(sg=>(sg.exercises||[]).length>0).length-1 && group.subGroups && (
                          <div style={{height:1,background:'#1C2730',marginTop:6}}/>
                        )}
                      </div>
                    ))}
                  </div>
                );
              })()}
            </div>
          );
        })}

        {editMode && (
          <button onClick={addGroup}
            style={{background:'#0E151A',border:'1px dashed #1C2730',borderRadius:16,padding:14,color:'#3D5560',fontSize:13,cursor:'pointer',textAlign:'center'}}>
            + إضافة مجموعة جديدة
          </button>
        )}
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function FitnessApp() {
  const [tab,          setTab]          = useState('dashboard');
  const [logs,         setLogs]         = useState({});
  const [weightLog,    setWeightLog]    = useState([]);
  const [muscleGroups, setMuscleGroups] = useState(MUSCLE_GROUPS_DEFAULT);
  const [importMsg,    setImportMsg]    = useState(null);
  const [showImport,   setShowImport]   = useState(false);
  const [importJson,   setImportJson]   = useState('');
  const [exportText,   setExportText]   = useState('');
  const [importStep,   setImportStep]   = useState('paste');
  const [importPreview,setImportPreview]= useState(null);
  const [ready,        setReady]        = useState(false);

  useEffect(()=>{
    (async()=>{
      try {
        const l = await window.storage.get('fit_logs_v3');
        const w = await window.storage.get('fit_weight_v3');
        const m = await window.storage.get('fit_muscles_v1');

        // اذا الـ storage فارغ أو ما فيه بيانات، استخدم النسخة الاحتياطية المضمّنة
        const storedLogs = l ? JSON.parse(l.value) : null;
        const hasRealData = storedLogs && Object.keys(storedLogs).length > 0;

        if (hasRealData) {
          setLogs(storedLogs);
          if (w) setWeightLog(JSON.parse(w.value));
          if (m) setMuscleGroups(JSON.parse(m.value));
        } else {
          // استخدم البيانات المضمّنة واحفظها في الـ storage
          setLogs(BACKUP_DATA.fit_logs_v3);
          setWeightLog(BACKUP_DATA.fit_weight_v3);
          setMuscleGroups(BACKUP_DATA.fit_muscles_v1);
          await window.storage.set('fit_logs_v3', JSON.stringify(BACKUP_DATA.fit_logs_v3));
          await window.storage.set('fit_weight_v3', JSON.stringify(BACKUP_DATA.fit_weight_v3));
          await window.storage.set('fit_muscles_v1', JSON.stringify(BACKUP_DATA.fit_muscles_v1));
        }
      } catch(e){
        // في حال أي خطأ، حمّل البيانات المضمّنة
        setLogs(BACKUP_DATA.fit_logs_v3);
        setWeightLog(BACKUP_DATA.fit_weight_v3);
        setMuscleGroups(BACKUP_DATA.fit_muscles_v1);
      }
      setReady(true);
    })();
  },[]);

  const saveLogs = async nl => {
    setLogs(nl);
    try { await window.storage.set('fit_logs_v3', JSON.stringify(nl)); } catch(e){}
  };
  const saveWeightLog = async wl => {
    setWeightLog(wl);
    try { await window.storage.set('fit_weight_v3', JSON.stringify(wl)); } catch(e){}
  };
  const saveMuscleGroups = async mg => {
    setMuscleGroups(mg);
    try { await window.storage.set('fit_muscles_v1', JSON.stringify(mg)); } catch(e){}
  };

  const onExport = () => {
    const payload = { version:1, exportedAt:new Date().toISOString(), fit_logs_v3:logs, fit_weight_v3:weightLog, fit_muscles_v1:muscleGroups };
    setExportText(JSON.stringify(payload));
  };

  const onImportParse = () => {
    try {
      const data = JSON.parse(importJson.trim());
      if (!data.version) throw new Error();
      const mealCount = Object.values(data.fit_logs_v3 || {}).reduce((s,d)=>s+(d.meals?.length||0),0);
      const workoutCount = Object.values(data.fit_logs_v3 || {}).reduce((s,d)=>s+(d.workouts?.length||0),0);
      const weightCount = (data.fit_weight_v3 || []).length;
      const muscleCount = (data.fit_muscles_v1 || []).reduce((s,g)=>s+(g.exercises?.length||0),0);
      setImportPreview({data, mealCount, workoutCount, weightCount, muscleCount});
      setImportStep('confirm');
    } catch {
      setImportMsg({ok:false, text:'❌ النص غير صالح — تأكد من نسخه كاملاً'});
      setTimeout(()=>setImportMsg(null), 4000);
    }
  };

  const onImportConfirm = async () => {
    try {
      const data = importPreview.data;
      if (data.fit_logs_v3)    await saveLogs(data.fit_logs_v3);
      if (data.fit_weight_v3)  await saveWeightLog(data.fit_weight_v3);
      if (data.fit_muscles_v1) await saveMuscleGroups(data.fit_muscles_v1);
      setImportMsg({ok:true, text:'✅ تم الاستيراد بنجاح'});
      setShowImport(false); setImportJson(''); setImportStep('paste'); setImportPreview(null);
    } catch {
      setImportMsg({ok:false, text:'❌ فشل الاستيراد'});
    }
    setTimeout(()=>setImportMsg(null), 4000);
  };

  const [selectedDate, setSelectedDate] = useState(todayStr());

  const t = selectedDate;
  const todayData = logs[t] || {meals:[], workouts:[]};

  const addMeal = meal => saveLogs({...logs, [t]:{...todayData, meals:[...(todayData.meals||[]), {...meal, id:genId(), time:nowTime()}]}});
  const deleteMeal = id => saveLogs({...logs, [t]:{...todayData, meals:(todayData.meals||[]).filter(m=>m.id!==id)}});
  const editMeal = (id, updates) => saveLogs({...logs, [t]:{...todayData, meals:(todayData.meals||[]).map(m=>m.id===id?{...m,...updates}:m)}});
  const addWorkout = w => saveLogs({...logs, [t]:{...todayData, workouts:[...(todayData.workouts||[]), {...w, id:genId(), time:nowTime()}]}});
  const deleteWorkout = id => saveLogs({...logs, [t]:{...todayData, workouts:(todayData.workouts||[]).filter(w=>w.id!==id)}});
  const editWorkout = (id, updated) => saveLogs({...logs, [t]:{...todayData, workouts:(todayData.workouts||[]).map(w=>w.id===id?updated:w)}});

  if (!ready) return (
    <div style={{background:'#080C0E',height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#00E5A0',gap:14,fontFamily:'sans-serif'}}>
      <div style={{fontSize:52}}>💪</div>
      <div style={{fontSize:15,color:'#3D5560'}}>جاري تحميل بياناتك...</div>
    </div>
  );

  return (
    <div style={{background:'#080C0E',minHeight:'100vh',maxWidth:440,margin:'0 auto',color:'#E8F0F2',position:'relative',paddingBottom:80}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Syne:wght@700;800&display=swap');
        * { box-sizing:border-box; margin:0; padding:0; font-family:'DM Sans',sans-serif; }
        ::-webkit-scrollbar { width:3px }
        ::-webkit-scrollbar-track { background:#080C0E }
        ::-webkit-scrollbar-thumb { background:#1C2730; border-radius:2px }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0 }
        select { -webkit-appearance:none; }
      `}</style>

      {tab==='dashboard' && <Dashboard todayData={todayData} logs={logs} weightLog={weightLog} saveWeightLog={saveWeightLog} onExport={onExport} onImportParse={onImportParse} onImportConfirm={onImportConfirm} importMsg={importMsg} showImport={showImport} setShowImport={setShowImport} importJson={importJson} setImportJson={setImportJson} exportText={exportText} setExportText={setExportText} importStep={importStep} setImportStep={setImportStep} importPreview={importPreview}/>}
      {tab==='nutrition'  && <Nutrition  todayData={todayData} addMeal={addMeal} deleteMeal={deleteMeal} editMeal={editMeal} selectedDate={selectedDate} setSelectedDate={setSelectedDate}/>}
      {tab==='workout'    && <Workout    todayData={todayData} addWorkout={addWorkout} deleteWorkout={deleteWorkout} editWorkout={editWorkout} logs={logs} muscleGroups={muscleGroups} selectedDate={selectedDate} setSelectedDate={setSelectedDate}/>}
      {tab==='muscles'    && <MuscleMap  logs={logs} muscleGroups={muscleGroups} saveMuscleGroups={saveMuscleGroups}/>}
      {tab==='progress'   && <Progress   logs={logs} weightLog={weightLog}/>}

      <BottomNav tab={tab} setTab={setTab}/>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FitnessApp />);
</script>
</body>
